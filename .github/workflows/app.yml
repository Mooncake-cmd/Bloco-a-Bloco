# O aplicativo para Android (pasta android/): gera o APK com o site de dist/ e publica na versão "app" do repositório.
# Link fixo para baixar: https://github.com/Mooncake-cmd/bloco-a-bloco/releases/download/app/bloco-a-bloco.apk
name: Aplicativo Android
on:
  push:
    branches: [app-teste]
permissions:
  contents: write
concurrency: { group: app-teste, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      # A chave de assinatura: o segredo BAB_KEYSTORE (o .jks em base64) com a senha em BAB_KEY_PASS, para as versões novas
      # instalarem por cima das antigas. Sem o segredo, uma chave feita na hora (aí, para atualizar, desinstale a anterior).
      - name: Chave de assinatura
        env: { KS: '${{ secrets.BAB_KEYSTORE }}', KP: '${{ secrets.BAB_KEY_PASS }}' }
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bab.jks"; echo "BAB_KEY_PASS=$KP" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16); echo "::add-mask::$P"; echo "BAB_KEY_PASS=$P" >> "$GITHUB_ENV"
            keytool -genkeypair -keystore "$RUNNER_TEMP/bab.jks" -storepass "$P" -keypass "$P" -alias bab -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Bloco a Bloco"
            echo "::warning::Sem o segredo BAB_KEYSTORE: o APK foi assinado com uma chave nova (para atualizar, desinstale o anterior)."
          fi
          echo "BAB_KEYSTORE_FILE=$RUNNER_TEMP/bab.jks" >> "$GITHUB_ENV"
      - name: Gerar o APK
        working-directory: android
        env: { APP_VERSION_CODE: '${{ github.run_number }}' }
        run: gradle --no-daemon assembleRelease
      # Build de teste (versão modificada pelo usuário): só como artefato da execução, sem publicar nada
      - uses: actions/upload-artifact@v4
        with: { name: bloco-a-bloco-modificado, path: android/app/build/outputs/apk/release/app-release.apk, retention-days: 1 }
      # o APK também vai para a própria branch de teste (para baixar com git; a branch é apagada depois)
      - name: Guardar o APK na branch de teste
        run: |
          mkdir -p saida && cp android/app/build/outputs/apk/release/app-release.apk saida/bloco-a-bloco-modificado.apk
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -f saida/bloco-a-bloco-modificado.apk && git commit -m "APK de teste" && git push origin HEAD:app-teste
