<title>Bloco a Bloco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ateliê de maquete. Viewport 3D à esquerda, paleta de blocos na lateral direita, barra de ferramentas no topo, hotbar sobre o viewport. */
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --panel-2:#e6ebe7; --fg:#18221d; --muted:#586861; --line:#cdd6d0;
  --accent:#b4530a; --accent-fg:#ffffff; --danger:#b3261e; --info:#1d6fa5; --hud:rgba(251,252,251,.86);
  --scene-bg:#dbe5e3; --scene-floor:#c9d7d4; --scene-grid:#9bb0aa; --scene-edge:#5d7770;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1412; --panel:#161d1a; --panel-2:#1f2924; --fg:#e5ebe7; --muted:#8c9d94; --line:#2a3631;
    --accent:#f0a23b; --accent-fg:#1a1204; --danger:#ff7b72; --info:#6cb6e8; --hud:rgba(22,29,26,.86);
    --scene-bg:#0d1210; --scene-floor:#141b18; --scene-grid:#2f3f39; --scene-edge:#4f6b60;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#161d1a; --panel-2:#1f2924; --fg:#e5ebe7; --muted:#8c9d94; --line:#2a3631;
  --accent:#f0a23b; --accent-fg:#1a1204; --danger:#ff7b72; --info:#6cb6e8; --hud:rgba(22,29,26,.86);
  --scene-bg:#0d1210; --scene-floor:#141b18; --scene-grid:#2f3f39; --scene-edge:#4f6b60;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(0,1fr) 308px;height:100%}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.brand small{font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
.group{display:flex;align-items:center;gap:2px;padding:2px;background:var(--panel-2);border-radius:8px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:28px;height:34px;padding:0 4px;border:0;border-radius:6px;background:transparent;color:var(--fg)}
.tbtn:hover{background:var(--line)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tbtn svg .f{fill:currentColor;fill-opacity:.22}
.tbtn.txt{padding:0 7px;font-weight:500}
.tbtn.primary{background:var(--accent);color:var(--accent-fg);font-weight:600}
.tbtn.primary:hover{filter:brightness(1.08)}
.spacer{flex:1 1 0}
.layer{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.layer input[type=range]{width:60px;accent-color:var(--accent)}
.layer output{font-family:var(--font-mono);min-width:38px;color:var(--fg)}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:40px;z-index:30;min-width:240px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
details.menu .pop button,details.menu .pop a{justify-content:flex-start;height:36px;width:100%;text-decoration:none;text-align:left;white-space:nowrap}
#viewport{position:relative;flex:1 1 auto;min-height:0;background:var(--scene-bg);overflow:hidden}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--hud);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
.slot{position:relative;width:44px;height:44px;border:2px solid transparent;border-radius:6px;background:var(--panel-2);padding:0;overflow:hidden}
.slot[aria-pressed="true"]{border-color:var(--accent)}
.slot .n{position:absolute;left:3px;top:1px;font:500 10px var(--font-mono);color:#fff;text-shadow:0 1px 2px #000}
.sw{display:block;width:100%;height:100%}
#hud-tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;background:var(--hud);border:1px solid var(--line);border-radius:8px;font:500 12px var(--font-mono);backdrop-filter:blur(6px);pointer-events:auto}
.chip b{font-weight:500;color:var(--muted)}
.chip button{border:0;background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:2px 8px;font-size:12px}
#eraseBtns{display:inline-flex;gap:4px}
#eraseBtns button{background:var(--line);color:var(--fg)}
#eraseBtns button[aria-pressed=true]{background:var(--danger);color:#fff}
#maskChip,#sculptChip,#symChip,#rulerChip{flex-wrap:wrap;max-width:min(560px,calc(100vw - 40px))}
.chip .mbtns{display:inline-flex;align-items:center;gap:4px}
.chip .mbtns button{background:var(--line);color:var(--fg)}
.chip .mbtns button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
#symChip .mbtns button[data-sa="0"][aria-pressed=true]{background:#e0533d;color:#fff}
#symChip .mbtns button[data-sa="1"][aria-pressed=true]{background:#3fa34d;color:#fff}
#symChip .mbtns button[data-sa="2"][aria-pressed=true]{background:#3d7ee0;color:#fff}
#selChip{flex-wrap:wrap;max-width:min(560px,calc(100vw - 40px))}
#selBtns{display:inline-flex;flex-wrap:wrap;gap:4px}
#selBtns button+button{background:var(--line);color:var(--fg)}
.dialog .err{color:var(--danger)}
#status{display:flex;flex-wrap:wrap;gap:4px 18px;padding:6px 16px;background:var(--panel);border-top:1px solid var(--line);font:12px var(--font-mono);color:var(--muted)}
#status span b{color:var(--fg);font-weight:500}
#sidebar{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-left:1px solid var(--line)}
#sidebar .head{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px}
#sidebar h2{margin:0;font:700 13px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#search{width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#chips{display:flex;flex-wrap:wrap;gap:4px}
#chips button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted)}
#chips button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
#list{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 8px 12px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:5px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left}
.item:hover{background:var(--panel-2)}
.item.sel{border-color:var(--accent);background:var(--panel-2)}
.item .sw{width:30px;height:30px;flex:none;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.item .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.item .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{font:11px var(--font-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .star{border:0;background:transparent;color:var(--muted);font-size:16px;padding:2px 4px;line-height:1}
.item .star.on{color:var(--accent)}
.empty{padding:20px 12px;color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
.dialog{width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.dialog h3{margin:0;font:700 20px var(--font-display);letter-spacing:-.01em}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dialog label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.dialog input[type=text],.dialog input[type=number],.dialog select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
.dialog .check{flex-direction:row;align-items:flex-start;gap:8px;color:var(--fg);font-size:13px}
.dialog .check input{margin-top:3px;accent-color:var(--accent)}
.btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
a.btn{display:inline-flex;align-items:center;color:var(--fg);text-decoration:none}
.dialog .get{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.dialog .get b{font-size:13px}
.dialog .get .row{align-items:center}
.dialog .get small{color:var(--muted);font-size:12px}
.dialog .get a:not(.btn){color:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.info{padding:10px 12px;border-radius:8px;background:var(--panel-2);font:12px/1.5 var(--font-mono)}
.mat{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.mat table{width:100%;border-collapse:collapse;font-size:13px}
.mat td{padding:5px 10px;border-bottom:1px solid var(--line)}
.mat td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.mat td small{color:var(--muted)}
.mat td.num .btn{font-family:var(--font-ui);height:32px}
.mat .sw{display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:8px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
kbd{font:500 11px var(--font-mono);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel-2)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:60;padding:8px 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:13px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#busy{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:70;width:min(360px,calc(100% - 32px));padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;font-size:13px}
#busy .bl{display:flex;align-items:center;gap:10px}
#busy .sp{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
#busy .bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 40%}
  #sidebar{border-left:0;border-top:1px solid var(--line)}
  .layer input[type=range]{width:80px}
  .slot{width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){#toast,#busy .bar i{transition:none}#busy .sp{animation:none}}
</style>

    <div id="viewport">
      <div id="hud-tl"><div class="chip" id="anchorChip" hidden><span id="anchorTxt"></span><button id="anchorCancel">Cancelar</button></div><div class="chip" id="eraseChip" hidden><b>Borracha</b><span id="eraseBtns"><button data-es="1">1×1</button><button data-es="2">2×2</button><button data-es="3">3×3</button></span></div><div class="chip" id="maskChip" hidden><span id="maskTxt"></span><span class="mbtns"><b>Raio</b><button id="maskMinus" title="Diminuir (-)">−</button><span id="maskR">2</span><button id="maskPlus" title="Aumentar (+)">+</button></span><span class="mbtns"><button data-ms="sphere">Esfera</button><button data-ms="cube">Cubo</button></span></div><div class="chip" id="sculptChip" hidden><span class="mbtns"><button data-sm="raise">Elevar</button><button data-sm="lower">Afundar</button><button data-sm="smooth">Suavizar</button><button data-sm="flat">Aplainar</button></span><span class="mbtns"><b>Raio</b><button id="sculptRm" title="Diminuir (-)">−</button><span id="sculptR">5</span><button id="sculptRp" title="Aumentar (+)">+</button></span><span class="mbtns"><b>Força</b><button id="sculptSm">−</button><span id="sculptS">2</span><button id="sculptSp">+</button></span></div><div class="chip" id="symChip" hidden><b>Simetria</b><span class="mbtns"><button data-sa="0">X</button><button data-sa="1">Y</button><button data-sa="2">Z</button></span><span id="symPos"></span><span class="mbtns"><button id="symMinus" title="Mover o plano meio bloco">−½</button><button id="symPlus" title="Mover o plano meio bloco">+½</button><button id="symMid">Centro</button><button id="symOff">Desligar</button></span></div><div class="chip" id="rulerChip" hidden><span id="rulerTxt"></span><span class="mbtns" id="rulerBtns" hidden><button id="rulerUndo" title="Tirar o último ponto">Desfazer ponto</button><button id="rulerClear" title="Esc">Limpar</button></span></div><div class="chip" id="selChip" hidden><span id="selTxt"></span><span id="selBtns"></span></div></div>

  </div>
  <aside id="sidebar" aria-label="Blocos do Minecraft">

      <div id="chips"></div>

    <div id="list"></div>
  </aside>

<script>
// Exportadores de estruturas do Minecraft: .schem (Java, Sponge v3) e .mcstructure (Bedrock).
// Sem dependências: funciona no navegador e no Node.
(function (root) {
  'use strict';

  // ---------- Escritor NBT mínimo ----------
  // Valores: {t:'byte'|'short'|'int'|'string'|'bytes'|'list'|'compound', v:...}
  function NbtWriter(little) {
    this.little = little;
    this.buf = new Uint8Array(1024);
    this.len = 0;
  }
  NbtWriter.prototype.ensure = function (n) {
    if (this.len + n <= this.buf.length) return;
    let cap = this.buf.length;
    while (cap < this.len + n) cap *= 2;
    const nb = new Uint8Array(cap);
    nb.set(this.buf.subarray(0, this.len));
    this.buf = nb;
  };
  NbtWriter.prototype.u8 = function (v) { this.ensure(1); this.buf[this.len++] = v & 255; };
  NbtWriter.prototype.u16 = function (v) {
    this.ensure(2);
    if (this.little) { this.buf[this.len++] = v & 255; this.buf[this.len++] = (v >> 8) & 255; }
    else { this.buf[this.len++] = (v >> 8) & 255; this.buf[this.len++] = v & 255; }
  };
  NbtWriter.prototype.i32 = function (v) {
    this.ensure(4);
    if (this.little) for (let i = 0; i < 4; i++) this.buf[this.len++] = (v >> (8 * i)) & 255;
    else for (let i = 3; i >= 0; i--) this.buf[this.len++] = (v >> (8 * i)) & 255;
  };
  NbtWriter.prototype.str = function (s) {
    const b = new TextEncoder().encode(s);
    this.u16(b.length);
    this.ensure(b.length);
    this.buf.set(b, this.len);
    this.len += b.length;
  };
  const TAGID = { byte: 1, short: 2, int: 3, bytes: 7, string: 8, list: 9, compound: 10, ints: 11 };
  NbtWriter.prototype.payload = function (val) {
    switch (val.t) {
      case 'byte': this.u8(val.v); break;
      case 'short': this.u16(val.v); break;
      case 'int': this.i32(val.v); break;
      case 'string': this.str(val.v); break;
      case 'bytes':
        this.i32(val.v.length);
        this.ensure(val.v.length);
        this.buf.set(val.v, this.len);
        this.len += val.v.length;
        break;
      case 'ints': this.i32(val.v.length); for (const x of val.v) this.i32(x); break;
      case 'list': { // val.of = tipo dos itens; val.v = array de payloads
        this.u8(TAGID[val.of] || 0);
        this.i32(val.v.length);
        for (const item of val.v) this.payload({ t: val.of, v: item });
        break;
      }
      case 'compound':
        for (const k of Object.keys(val.v)) {
          const c = val.v[k];
          this.u8(TAGID[c.t]);
          this.str(k);
          this.payload(c);
        }
        this.u8(0);
        break;
      default: throw new Error('tag NBT desconhecida: ' + val.t);

/* Guardar no navegador (IndexedDB). Se não der, os pacotes valem só até recarregar a página. */
function idb() {
  return new Promise(function (res, rej) {
    try {
      var r = indexedDB.open('bloco-a-bloco', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
    } catch (e) { rej(e); }

      t.oncomplete = function () { res(q && q.result); }; t.onerror = t.onabort = function () { rej(t.error); };

  return idbDo('readwrite', function (s) { return s.put(packs, 'packs'); })
    .then(function () { return true; }, function () { toast('Não foi possível guardar o pacote neste navegador. Ele vale até recarregar a página.'); return false; });
}
function loadPacks() {
  return idbDo('readonly', function (s) { return s.get('packs'); }).then(function (v) {
    if (!Array.isArray(v)) return;
    packs = v;
    if (packs.some(function (P) { return P.v !== PACK_V; })) setTimeout(function () { toast('A lista de blocos mudou. Escolha o pacote de novo em Projeto > Texturas para ver as texturas novas.'); }, 900);
  }, function () {});
}

/* Diálogo */
async function addPackFrom(src, name) {
  busy('Procurando as texturas no pacote…', null);
  var P = await importPack(src, name, 0, function (i, n) { busy('Lendo texturas: ' + i + ' de ' + n, i / n); });
  if (!P) throw new Error('Não achei texturas de blocos nesse arquivo. Escolha um pacote de recursos (Bedrock ou Java).');
  packs = packs.filter(function (q) { return q.name !== P.name; }).concat([P]);
  texOn = true; try { localStorage.setItem('bloco-a-bloco-tex', '1'); } catch (e) {}
  onTexProgress = function (i, n) { busy('Preparando texturas: ' + i + ' de ' + n, i / n); };
  try { await applyTextures(); } finally { onTexProgress = null; }
  busy('Guardando o pacote neste navegador…', null);
  await savePacks();
  busyEnd();
  toast(P.name + ': ' + packBlocks(P) + ' de ' + BLOCKS.length + ' blocos com textura.', 6000);
  if ($('texList')) openTextures();
}
function packError(x, what) {
  busyEnd();
  toast((x && x.message) || 'Não foi possível ler ' + what + '.', 10000);
}
function openTextures() {
  var list = packs.slice().reverse().map(function (P, i) {
    return '<tr><td>' + esc(P.name) + '<br><small>' + (P.kind === 'java' ? 'Java' : 'Bedrock') + ' · ' + packBlocks(P) + ' blocos</small></td>' +
      '<td class="num"><button class="btn" data-rm="' + (packs.length - 1 - i) + '">Remover</button></td></tr>';
  }).join('');
  openDialog('<h3>Texturas</h3>' +
    '<p>Escolha um pacote de recursos para ver os blocos com as texturas de verdade. Serve pacote do Bedrock (.mcpack, .zip ou a pasta) e do Java (.zip). Só muda a aparência no editor: a exportação continua igual.</p>' +
    '<div class="row"><button class="btn primary" id="txFile">Escolher arquivo…</button><button class="btn" id="txDir">Escolher pasta…</button></div>' +
    (packs.length ? '<div class="mat" id="texList"><table>' + list + '</table></div>' +
      '<label class="check"><input type="checkbox" id="txOn"' + (texOn ? ' checked' : '') + '><span>Mostrar texturas (' + texBlocks + ' de ' + BLOCKS.length + ' blocos). Se houver mais de um pacote, o de cima tem prioridade e os de baixo completam o que faltar.</span></label>'
      : '<div class="info" id="texList">Nenhum pacote carregado. Os blocos aparecem com a cor média de cada um.</div>') +
    '<div class="get"><b>Não tem pacote? Use as texturas padrão do Minecraft</b>' +
      '<div class="row"><a class="btn" id="txGet" href="' + BEDROCK_ZIP + '" target="_blank" rel="noopener" download>Baixar texturas padrão (Bedrock) ↓</a><small>ZIP oficial da Mojang no GitHub (Mojang/bedrock-samples), cerca de 170 MB</small></div>' +
      '<small>1. Baixe o ZIP. 2. Volte aqui e toque em <b>Escolher arquivo…</b> 3. Escolha o ZIP baixado, sem descompactar: o editor acha a pasta de texturas sozinho e guarda só o que usa (fica salvo neste navegador). No celular, ler o arquivo pode levar um minuto; o andamento aparece no alto da tela. <a href="https://github.com/Mojang/bedrock-samples" target="_blank" rel="noopener">Página do repositório ↗</a></small></div>' +
    '<div class="row"><button class="btn" id="txClose">Fechar</button></div>',
    function () {
      $('txClose').onclick = closeDialog;
      $('txFile').onclick = function () { $('packIn').click(); };
      $('txDir').onclick = function () { $('packDirIn').click(); };
      if ($('txOn')) $('txOn').onchange = function (e) {
        texOn = e.target.checked; try { localStorage.setItem('bloco-a-bloco-tex', texOn ? '1' : '0'); } catch (x) {}
        applyTextures();
      };
      overlayRoot.querySelectorAll('[data-rm]').forEach(function (bt) {
        bt.onclick = async function () { packs.splice(+bt.getAttribute('data-rm'), 1); await applyTextures(); savePacks(); openTextures(); };
      });
    });
}
$('texBtn').addEventListener('click', function () { $('menu').open = false; openTextures(); });
$('packIn').addEventListener('change', async function (e) {
  var f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  busy('Abrindo ' + f.name + '…', null);
  try { await addPackFrom(await openZip(f), f.name.replace(/\.(zip|mcpack|mcaddon)$/i, '')); } catch (x) { packError(x, 'o pacote'); }
});
$('packDirIn').addEventListener('change', async function (e) {
  var fs = e.target.files; e.target.value = '';
  if (!fs || !fs.length) return;
  var nm = (fs[0].webkitRelativePath || fs[0].name).split('/')[0];
  try { await addPackFrom(openDir(fs), nm); } catch (x) { packError(x, 'a pasta'); }
});

/* ---------- Árvores: Usar numa muda faz a árvore crescer, como a farinha de osso ---------- */
/* Cada gerador imita o formato da árvore do jogo (tronco, copa, cipós, cacau, raízes), com variação aleatória a cada uso.
   Como no jogo: o tronco precisa de espaço livre, as folhas só ocupam o ar (ou plantinhas) e o bloco de grama embaixo do
   tronco vira terra. Carvalho-escuro e carvalho-pálido só crescem com 4 mudas em quadrado; abeto e selva crescem gigantes assim. */
var TREE_R = Math.random;
function tRnd(a, b) { return a + Math.floor(TREE_R() * (b - a + 1)); }
function tChance(p) { return TREE_R() < p; }
function cellOf(name, props) {
  var bi = BY_JAVA[name]; if (bi == null) return 0;
  var b = BLOCKS[bi];
  if (b.shape) return mkCell(bi, stateIndex(b, props || {}));
  if (b.ori && props && props[b.ori.k] != null) for (var i = 0; i < b.ori.o.length; i++) if (b.ori.o[i][0] === props[b.ori.k]) return mkCell(bi, i);
  return mkCell(bi);
}
/* Plantinhas que a árvore pode cobrir (só as de um bloco) */
var TREE_SOFT = { short_grass: 1, grass: 1, fern: 1, dead_bush: 1, snow: 1, vine: 1, moss_carpet: 1, pale_moss_carpet: 1, leaf_litter: 1, dandelion: 1, poppy: 1, short_dry_grass: 1 };
function treeFree(x, y, z, sap, log) {
  if (!inB(x, y, z)) return false;
  var v = gget(x, y, z); if (!v) return true;
  var j = BLOCKS[cellBlock(v)].java;
  return j === sap || j in TREE_SOFT || (log && /_leaves$|_wart_block$/.test(j)); // tronco e galhos atravessam folhas
}

/* Plano da árvore: mapa de células; o tronco tem prioridade sobre folhas */
function TreePlan(sap) { this.cells = new Map(); this.trunk = []; this.sap = sap; }
TreePlan.prototype.key = function (x, y, z) { return x + ',' + y + ',' + z; };
TreePlan.prototype.log = function (x, y, z, name, axis) {
  this.cells.set(this.key(x, y, z), { x: x, y: y, z: z, v: cellOf(name, { axis: axis || 'y' }), t: 1 });
  this.trunk.push([x, y, z]);
};
TreePlan.prototype.put = function (x, y, z, name, props, strong) {
  var k = this.key(x, y, z), o = this.cells.get(k);
  if (o && (o.t || !strong)) return;
  this.cells.set(k, { x: x, y: y, z: z, v: cellOf(name, props), t: 0 });
};
TreePlan.prototype.has = function (x, y, z) { return this.cells.has(this.key(x, y, z)); };
TreePlan.prototype.leaf = function (x, y, z, name) { this.put(x, y, z, name); };
/* Camada de folhas quadrada de raio r em volta de (cx, cz), com as quinas cortadas (sempre, ou ao acaso) */
TreePlan.prototype.layer = function (cx, y, cz, r, name, corners, wide) {
  var w = wide ? 1 : 0;
  for (var dx = -r; dx <= r + w; dx++) for (var dz = -r; dz <= r + w; dz++) {
    var ex = dx < 0 ? -dx : dx - w, ez = dz < 0 ? -dz : dz - w;
    if (r > 0 && ex === r && ez === r && (corners === 'cut' || (corners === 'rand' && tChance(0.5)))) continue;
    this.leaf(cx + dx, y, cz + dz, name);
  }
};
/* Camada redonda (disco) */
TreePlan.prototype.disk = function (cx, y, cz, r, name, wide, ragged) {
  var w = wide ? 0.5 : 0, R = Math.ceil(r) + 1;
  for (var dx = -R; dx <= R + 1; dx++) for (var dz = -R; dz <= R + 1; dz++) {
    var ddx = dx - w, ddz = dz - w, d = Math.sqrt(ddx * ddx + ddz * ddz);
    if (d > r + 0.3 || (ragged && d > r - 0.7 && tChance(ragged))) continue;
    this.leaf(cx + dx, y, cz + dz, name);

};
TreePlan.prototype.trunkUp = function (x, y, z, h, name, wide) {
  for (var i = 0; i < h; i++) {
    this.log(x, y + i, z, name);
    if (wide) { this.log(x + 1, y + i, z, name); this.log(x, y + i, z + 1, name); this.log(x + 1, y + i, z + 1, name); }
  }
};
/* Galho de toras em linha reta (com o eixo certo) */
TreePlan.prototype.branch = function (x0, y0, z0, x1, y1, z1, name) {
  var n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0));
  for (var i = 1; i <= n; i++) {
    var x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n), z = Math.round(z0 + (z1 - z0) * i / n);

    this.log(x, y, z, name, ay >= ax && ay >= az ? 'y' : ax >= az ? 'x' : 'z');

};

var DIRS4 = [[0, -1, 'north', 'south'], [1, 0, 'east', 'west'], [0, 1, 'south', 'north'], [-1, 0, 'west', 'east']];
/* Cipós pendurados nas bordas da copa (selva, pântano) */
function addVines(P, prob, maxLen) {
  var leaves = []; P.cells.forEach(function (c) { if (!c.t) leaves.push(c); });
  leaves.forEach(function (c) {
    DIRS4.forEach(function (d) {
      if (!tChance(prob)) return;
      var x = c.x + d[0], z = c.z + d[1];
      if (P.has(x, c.y, z)) return;
      var len = tRnd(1, maxLen), pr = {}; pr[d[3]] = 'true';
      for (var y = c.y; y > c.y - len; y--) { if (P.has(x, y, z)) break; P.put(x, y, z, 'vine', pr); }
    });
  });
}
/* Cipós e cacau no tronco */
function trunkDecor(P, x0, y0, z0, h, wide, vineProb, cocoaProb) {
  var w = wide ? 1 : 0;
  for (var y = y0; y < y0 + h; y++) for (var tx = 0; tx <= w; tx++) for (var tz = 0; tz <= w; tz++) {
    DIRS4.forEach(function (d) {
      var x = x0 + tx + d[0], z = z0 + tz + d[1];
      if (P.has(x, y, z)) return;
      if (tChance(cocoaProb) && y < y0 + 4) { P.put(x, y, z, 'cocoa', { facing: d[3], age: String(tRnd(0, 2)) }); return; }
      if (tChance(vineProb)) { var pr = {}; pr[d[3]] = 'true'; P.put(x, y, z, 'vine', pr); }
    });
  }
}
/* Copa de bolha (carvalho, bétula, selva pequena): 4 camadas, raio 2, 2, 1, 1 */
function blobCrown(P, x, top, z, leaves, r) {
  r = r || 2;
  for (var y = top - 3; y <= top; y++) {
    var rr = y >= top - 1 ? r - 1 : r;
    P.layer(x, y, z, rr, leaves, y === top ? 'cut' : 'rand');
  }
}
/* Aglomerado redondo de folhas (carvalho grande, galhos) */
function cluster(P, x, y, z, leaves, rs) {
  rs = rs || [2, 3, 3, 2];
  for (var i = 0; i < rs.length; i++) P.disk(x, y + i, z, rs[i] - 0.5, leaves, false, 0.25);
}

var TREES = {
  oak: function (P, x, y, z, big) {
    if (big || tChance(0.1)) return fancyTree(P, x, y, z, 'oak_log', 'oak_leaves');
    var h = tRnd(4, 6); P.trunkUp(x, y, z, h, 'oak_log'); blobCrown(P, x, y + h, z, 'oak_leaves');
  },
  birch: function (P, x, y, z, big) {
    var h = tRnd(5, 7) + (big ? tRnd(5, 7) : 0); P.trunkUp(x, y, z, h, 'birch_log'); blobCrown(P, x, y + h, z, 'birch_leaves');
  },
  spruce: function (P, x, y, z, big, wide) {
    if (wide) return megaSpruce(P, x, y, z);
    if (big) { // pinheiro: copa só no alto
      var hp = tRnd(7, 10); P.trunkUp(x, y, z, hp, 'spruce_log');
      P.leaf(x, y + hp, z, 'spruce_leaves'); P.layer(x, y + hp - 1, z, 1, 'spruce_leaves', 'cut');
      for (var yy = y + hp - 2; yy >= y + hp - 4; yy--) P.layer(x, yy, z, yy === y + hp - 3 ? 2 : 1, 'spruce_leaves', yy === y + hp - 3 ? 'cut' : 'rand');
      return;
    }

    for (var yy = top; yy >= top - fh; yy--) {

    }
  },
  jungle: function (P, x, y, z, big, wide) {
