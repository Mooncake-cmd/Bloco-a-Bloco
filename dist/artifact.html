<title>Bloco a Bloco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ateliê de maquete. Viewport 3D à esquerda, paleta de blocos na lateral direita, barra de ferramentas no topo, hotbar sobre o viewport. */
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --panel-2:#e6ebe7; --fg:#18221d; --muted:#586861; --line:#cdd6d0;
  --accent:#b4530a; --accent-fg:#ffffff; --danger:#b3261e; --info:#1d6fa5; --hud:rgba(251,252,251,.86);
  --scene-bg:#dbe5e3; --scene-floor:#c9d7d4; --scene-grid:#9bb0aa; --scene-edge:#5d7770;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1412; --panel:#161d1a; --panel-2:#1f2924; --fg:#e5ebe7; --muted:#8c9d94; --line:#2a3631;
    --accent:#f0a23b; --accent-fg:#1a1204; --danger:#ff7b72; --info:#6cb6e8; --hud:rgba(22,29,26,.86);
    --scene-bg:#0d1210; --scene-floor:#141b18; --scene-grid:#2f3f39; --scene-edge:#4f6b60;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#161d1a; --panel-2:#1f2924; --fg:#e5ebe7; --muted:#8c9d94; --line:#2a3631;
  --accent:#f0a23b; --accent-fg:#1a1204; --danger:#ff7b72; --info:#6cb6e8; --hud:rgba(22,29,26,.86);
  --scene-bg:#0d1210; --scene-floor:#141b18; --scene-grid:#2f3f39; --scene-edge:#4f6b60;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(0,1fr) 308px;height:100%}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.brand small{font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
.group{display:flex;align-items:center;gap:2px;padding:2px;background:var(--panel-2);border-radius:8px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:34px;height:34px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--fg)}
.tbtn:hover{background:var(--line)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tbtn svg .f{fill:currentColor;fill-opacity:.22}
.tbtn.txt{padding:0 12px;font-weight:500}
.tbtn.primary{background:var(--accent);color:var(--accent-fg);font-weight:600}
.tbtn.primary:hover{filter:brightness(1.08)}
.spacer{flex:1 1 0}
.layer{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.layer input[type=range]{width:96px;accent-color:var(--accent)}
.layer output{font-family:var(--font-mono);min-width:38px;color:var(--fg)}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:40px;z-index:30;min-width:200px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
details.menu .pop button{justify-content:flex-start;height:36px;width:100%}
#viewport{position:relative;flex:1 1 auto;min-height:0;background:var(--scene-bg);overflow:hidden}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--hud);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
.slot{position:relative;width:44px;height:44px;border:2px solid transparent;border-radius:6px;background:var(--panel-2);padding:0;overflow:hidden}
.slot[aria-pressed="true"]{border-color:var(--accent)}
.slot .n{position:absolute;left:3px;top:1px;font:500 10px var(--font-mono);color:#fff;text-shadow:0 1px 2px #000}
.sw{display:block;width:100%;height:100%}
#hud-tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;background:var(--hud);border:1px solid var(--line);border-radius:8px;font:500 12px var(--font-mono);backdrop-filter:blur(6px);pointer-events:auto}
.chip b{font-weight:500;color:var(--muted)}
.chip button{border:0;background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:2px 8px;font-size:12px}
#status{display:flex;flex-wrap:wrap;gap:4px 18px;padding:6px 16px;background:var(--panel);border-top:1px solid var(--line);font:12px var(--font-mono);color:var(--muted)}
#status span b{color:var(--fg);font-weight:500}
#sidebar{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-left:1px solid var(--line)}
#sidebar .head{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px}
#sidebar h2{margin:0;font:700 13px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#search{width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#chips{display:flex;flex-wrap:wrap;gap:4px}
#chips button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted)}
#chips button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
#list{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 8px 12px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:5px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left}
.item:hover{background:var(--panel-2)}
.item.sel{border-color:var(--accent);background:var(--panel-2)}
.item .sw{width:30px;height:30px;flex:none;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.item .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.item .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{font:11px var(--font-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .star{border:0;background:transparent;color:var(--muted);font-size:16px;padding:2px 4px;line-height:1}
.item .star.on{color:var(--accent)}
.empty{padding:20px 12px;color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
.dialog{width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.dialog h3{margin:0;font:700 20px var(--font-display);letter-spacing:-.01em}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dialog label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.dialog input[type=text],.dialog input[type=number]{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
.dialog .check{flex-direction:row;align-items:flex-start;gap:8px;color:var(--fg);font-size:13px}
.dialog .check input{margin-top:3px;accent-color:var(--accent)}
.btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.info{padding:10px 12px;border-radius:8px;background:var(--panel-2);font:12px/1.5 var(--font-mono)}
.mat{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.mat table{width:100%;border-collapse:collapse;font-size:13px}
.mat td{padding:5px 10px;border-bottom:1px solid var(--line)}
.mat td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.mat td small{color:var(--muted)}
.mat td.num .btn{font-family:var(--font-ui);height:32px}
.mat .sw{display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:8px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
kbd{font:500 11px var(--font-mono);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel-2)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:60;padding:8px 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:13px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 40%}
  #sidebar{border-left:0;border-top:1px solid var(--line)}
  .layer input[type=range]{width:80px}
  .slot{width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <div id="main">
    <div id="toolbar" role="toolbar" aria-label="Ferramentas de construção">
      <div class="group" id="tools"></div>
      <div class="group">
        <button class="tbtn" id="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4M3 9h8a5 5 0 010 10h-2"/></svg></button>
        <button class="tbtn" id="redo" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4M17 9H9a5 5 0 000 10h2"/></svg></button>
      </div>
      <div class="layer">
        <button class="tbtn txt" id="layerBtn" aria-pressed="false" title="Mostrar só até uma altura ( [ e ] )">Camada</button>
        <input type="range" id="layerRange" min="0" max="31" value="0" disabled aria-label="Altura da camada">
        <output id="layerOut">–</output>
      </div>
      <div class="spacer"></div>
      <button class="tbtn txt" id="matBtn" title="Lista de materiais">Materiais</button>
      <button class="tbtn txt primary" id="exportBtn" title="Exportar .schem / .mcstructure">Exportar</button>
      <details class="menu" id="menu">
        <summary class="tbtn txt" role="button" aria-label="Menu do projeto">Projeto ▾</summary>
        <div class="pop">
          <button class="tbtn txt" id="newBtn">Novo (limpar tudo)</button>
          <button class="tbtn txt" id="saveBtn">Salvar projeto (.json)</button>
          <button class="tbtn txt" id="openBtn">Abrir projeto…</button>
          <button class="tbtn txt" id="sizeBtn">Tamanho do espaço…</button>
          <button class="tbtn txt" id="gridBtn">Mostrar/ocultar grade</button>
          <button class="tbtn txt" id="texBtn">Texturas…</button>
          <button class="tbtn txt" id="themeBtn">Tema: automático</button>
          <button class="tbtn txt" id="helpBtn">Atalhos e ajuda</button>
        </div>
      </details>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
      <input type="file" id="packIn" accept=".zip,.mcpack,.mcaddon,application/zip" hidden>
      <input type="file" id="packDirIn" webkitdirectory hidden>
    </div>
    <div id="viewport">
      <div id="hud-tl"><div class="chip" id="anchorChip" hidden><span id="anchorTxt"></span><button id="anchorCancel">Cancelar</button></div></div>
      <div id="hotbar" aria-label="Blocos rápidos"></div>
    </div>
    <div id="status">
      <span>Alvo <b id="stPos">–</b></span>
      <span>Bloco <b id="stBlock">–</b></span>
      <span>Construção <b id="stSize">vazia</b></span>
      <span>Blocos <b id="stCount">0</b></span>
    </div>
  </div>
  <aside id="sidebar" aria-label="Blocos do Minecraft">
    <div class="head">
      <div class="brand">Bloco a Bloco</div>
      <h2>Blocos</h2>
      <input id="search" type="search" placeholder="Buscar bloco (ex.: oak, glass)" autocomplete="off" aria-label="Buscar bloco">
      <div id="chips"></div>
    </div>
    <div id="list"></div>
  </aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="overlayRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Exportadores de estruturas do Minecraft: .schem (Java, Sponge v3) e .mcstructure (Bedrock).
// Sem dependências: funciona no navegador e no Node.
(function (root) {
  'use strict';

  // ---------- Escritor NBT mínimo ----------
  // Valores: {t:'byte'|'short'|'int'|'string'|'bytes'|'list'|'compound', v:...}
  function NbtWriter(little) {
    this.little = little;
    this.buf = new Uint8Array(1024);
    this.len = 0;
  }
  NbtWriter.prototype.ensure = function (n) {
    if (this.len + n <= this.buf.length) return;
    let cap = this.buf.length;
    while (cap < this.len + n) cap *= 2;
    const nb = new Uint8Array(cap);
    nb.set(this.buf.subarray(0, this.len));
    this.buf = nb;
  };
  NbtWriter.prototype.u8 = function (v) { this.ensure(1); this.buf[this.len++] = v & 255; };
  NbtWriter.prototype.u16 = function (v) {
    this.ensure(2);
    if (this.little) { this.buf[this.len++] = v & 255; this.buf[this.len++] = (v >> 8) & 255; }
    else { this.buf[this.len++] = (v >> 8) & 255; this.buf[this.len++] = v & 255; }
  };
  NbtWriter.prototype.i32 = function (v) {
    this.ensure(4);
    if (this.little) for (let i = 0; i < 4; i++) this.buf[this.len++] = (v >> (8 * i)) & 255;
    else for (let i = 3; i >= 0; i--) this.buf[this.len++] = (v >> (8 * i)) & 255;
  };
  NbtWriter.prototype.str = function (s) {
    const b = new TextEncoder().encode(s);
    this.u16(b.length);
    this.ensure(b.length);
    this.buf.set(b, this.len);
    this.len += b.length;
  };
  const TAGID = { byte: 1, short: 2, int: 3, bytes: 7, string: 8, list: 9, compound: 10, ints: 11 };
  NbtWriter.prototype.payload = function (val) {
    switch (val.t) {
      case 'byte': this.u8(val.v); break;
      case 'short': this.u16(val.v); break;
      case 'int': this.i32(val.v); break;
      case 'string': this.str(val.v); break;
      case 'bytes':
        this.i32(val.v.length);
        this.ensure(val.v.length);
        this.buf.set(val.v, this.len);
        this.len += val.v.length;
        break;
      case 'ints': this.i32(val.v.length); for (const x of val.v) this.i32(x); break;
      case 'list': { // val.of = tipo dos itens; val.v = array de payloads
        this.u8(TAGID[val.of] || 0);
        this.i32(val.v.length);
        for (const item of val.v) this.payload({ t: val.of, v: item });
        break;
      }
      case 'compound':
        for (const k of Object.keys(val.v)) {
          const c = val.v[k];
          this.u8(TAGID[c.t]);
          this.str(k);
          this.payload(c);
        }
        this.u8(0);
        break;
      default: throw new Error('tag NBT desconhecida: ' + val.t);
    }
  };
  NbtWriter.prototype.finish = function () { return this.buf.slice(0, this.len); };

  function nbtRoot(name, compound, little) {
    const w = new NbtWriter(little);
    w.u8(10);
    w.str(name);
    w.payload({ t: 'compound', v: compound });
    return w.finish();
  }

  // ---------- Util ----------
  function varint(out, n) {
    while (n >= 0x80) { out.push((n & 0x7f) | 0x80); n >>>= 7; }
    out.push(n);
  }

  function bounds(voxels) {
    let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    for (const [x, y, z] of voxels) {
      if (x < minX) minX = x; if (y < minY) minY = y; if (z < minZ) minZ = z;
      if (x > maxX) maxX = x; if (y > maxY) maxY = y; if (z > maxZ) maxZ = z;
    }
    return { minX, minY, minZ, maxX, maxY, maxZ, w: maxX - minX + 1, h: maxY - minY + 1, l: maxZ - minZ + 1 };
  }

  async function gzip(u8) {
    if (typeof CompressionStream !== 'undefined') {
      const cs = new CompressionStream('gzip');
      const stream = new Blob([u8]).stream().pipeThrough(cs);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    // Node
    const zlib = require('zlib');
    return new Uint8Array(zlib.gzipSync(u8));
  }

  // Estados padrão extras (folhas não devem decair)
  function javaState(blk) {
    if (/_leaves$/.test(blk.java)) return '[persistent=true]';
    return '';
  }

  // ---------- .schem (Sponge Schematic v3, Java) ----------
  // voxels: array de [x,y,z,idx]; BLOCKS[idx] = {java, bedrock}
  async function exportSchem(voxels, BLOCKS, opts) {
    opts = opts || {};
    if (!voxels.length) throw new Error('A construção está vazia.');
    const b = bounds(voxels);
    const grid = new Int32Array(b.w * b.h * b.l).fill(-1);
    for (const [x, y, z, idx] of voxels) {
      grid[((y - b.minY) * b.l + (z - b.minZ)) * b.w + (x - b.minX)] = idx;
    }
    const palette = { 'minecraft:air': 0 };
    let next = 1;
    const data = [];
    for (let i = 0; i < grid.length; i++) {
      const idx = grid[i];
      if (idx < 0) { varint(data, 0); continue; }
      const key = 'minecraft:' + BLOCKS[idx].java + javaState(BLOCKS[idx]);
      if (palette[key] === undefined) palette[key] = next++;
      varint(data, palette[key]);
    }
    const pal = {};
    for (const k of Object.keys(palette)) pal[k] = { t: 'int', v: palette[k] };
    const dataVersion = opts.dataVersion || 4671; // Java 1.21.11
    const root = {
      Schematic: {
        t: 'compound',
        v: {
          Version: { t: 'int', v: 3 },
          DataVersion: { t: 'int', v: dataVersion },
          Metadata: { t: 'compound', v: { Name: { t: 'string', v: opts.name || 'construcao' }, Author: { t: 'string', v: opts.author || '' } } },
          Width: { t: 'short', v: b.w },
          Height: { t: 'short', v: b.h },
          Length: { t: 'short', v: b.l },
          Offset: { t: 'ints', v: [0, 0, 0] },
          Blocks: {
            t: 'compound',
            v: {
              Palette: { t: 'compound', v: pal },
              Data: { t: 'bytes', v: Uint8Array.from(data) },
              BlockEntities: { t: 'list', of: 'compound', v: [] }
            }
          }
        }
      }
    };
    return gzip(nbtRoot('', root, false));
  }

  // ---------- .mcstructure (Bedrock) ----------
  const BEDROCK_BLOCK_VERSION = 18090528; // 1.20.80: o jogo atualiza para a versão atual ao carregar
  function bedrockStates(blk) {
    if (/_leaves$/.test(blk.bedrock)) return { persistent_bit: { t: 'byte', v: 1 }, update_bit: { t: 'byte', v: 0 } };
    return {};
  }
  // opts.preserveTerrain: células vazias viram structure_void (não substituem o que já existe no mundo)
  async function exportMcstructure(voxels, BLOCKS, opts) {
    opts = opts || {};
    if (!voxels.length) throw new Error('A construção está vazia.');
    const b = bounds(voxels);
    const sx = b.w, sy = b.h, sz = b.l;
    const total = sx * sy * sz;
    const grid = new Int32Array(total).fill(-1);
    for (const [x, y, z, idx] of voxels) {
      grid[((x - b.minX) * sy + (y - b.minY)) * sz + (z - b.minZ)] = idx;
    }
    const emptyName = opts.preserveTerrain === false ? 'minecraft:air' : 'minecraft:structure_void';
    const pal = []; const palIndex = {};
    function getPal(name, states) {
      if (palIndex[name] === undefined) {
        palIndex[name] = pal.length;
        pal.push({ name: { t: 'string', v: name }, states: { t: 'compound', v: states }, version: { t: 'int', v: BEDROCK_BLOCK_VERSION } });
      }
      return palIndex[name];
    }
    const emptyIdx = getPal(emptyName, {});
    const layer0 = new Array(total);
    for (let i = 0; i < total; i++) {
      const idx = grid[i];
      if (idx < 0) { layer0[i] = emptyIdx; continue; }
      const blk = BLOCKS[idx];
      layer0[i] = getPal('minecraft:' + blk.bedrock, bedrockStates(blk));
    }
    const layer1 = new Array(total).fill(-1);
    const root = {
      format_version: { t: 'int', v: 1 },

  SX = sx; SY = sy; SZ = sz;
  grid = new Uint16Array(SX * SY * SZ); blockCount = 0;
  undoStack = []; redoStack = []; batch = null; stroke = null; anchor = null; updateAnchorChip();
  layerOn = false; layerY = 0; syncLayerUI();
  clearChunks(); dirty.clear(); dirtyAll();
  if (scene) { buildHelpers(); resetCamera(); }
  hoverT = null;
}
function autosave() {
  try { localStorage.setItem(KEY, JSON.stringify(serialize())); } catch (e) {}
}
function resizeWorld(sx, sy, sz) {
  var old = grid, ox = SX, oy = SY, oz = SZ;
  var data = [];
  for (var y = 0; y < Math.min(oy, sy); y++) for (var z = 0; z < Math.min(oz, sz); z++) for (var x = 0; x < Math.min(ox, sx); x++) {
    var v = old[(y * oz + z) * ox + x]; if (v) data.push([x, y, z, v]);
  }
  newWorld(sx, sy, sz);
  for (var i = 0; i < data.length; i++) { grid[idx(data[i][0], data[i][1], data[i][2])] = data[i][3]; blockCount++; }
  dirtyAll(); changed();
}
function buildSample() {
  var ox = Math.floor((SX - 9) / 2), oz = Math.floor((SZ - 9) / 2);
  function B(n) { return (n in BY_JAVA ? BY_JAVA[n] : 0) + 1; }
  function put(x, y, z, n) { grid[idx(ox + x, y, oz + z)] = B(n); blockCount++; }
  var x, y, z;
  for (x = 0; x < 9; x++) for (z = 0; z < 9; z++) put(x, 0, z, 'cobblestone');
  for (y = 1; y <= 3; y++) for (x = 0; x < 9; x++) for (z = 0; z < 9; z++) {
    var edge = x === 0 || x === 8 || z === 0 || z === 8;
    if (!edge) continue;
    var corner = (x === 0 || x === 8) && (z === 0 || z === 8);
    if (corner) put(x, y, z, 'oak_log');
    else if (z === 0 && x === 4 && y <= 2) continue;
    else if (y === 2 && ((z === 0 || z === 8) && (x === 2 || x === 6) || (x === 0 || x === 8) && (z === 3 || z === 5 || z === 4))) put(x, y, z, 'glass');
    else put(x, y, z, 'oak_planks');
  }
  for (var k = 0; k < 5; k++) for (x = -1 + k; x <= 9 - k; x++) for (z = -1; z <= 9; z++) {
    if (x === -1 + k || x === 9 - k) put(x, 4 + k, z, 'spruce_planks');
    else if (k === 4) put(x, 4 + k, z, 'spruce_planks');
  }
  for (x = 1; x < 8; x++) for (z = 1; z < 8; z++) { /* piso interno */ grid[idx(ox + x, 0, oz + z)] = B('oak_planks'); }
}
$('undo').addEventListener('click', undo);
$('redo').addEventListener('click', redo);

/* ---------- Diálogos ---------- */
var overlayRoot = $('overlayRoot');
function closeDialog() { overlayRoot.innerHTML = ''; }
function openDialog(html, onMount) {
  overlayRoot.innerHTML = '<div class="overlay" id="ov"><div class="dialog" role="dialog" aria-modal="true">' + html + '</div></div>';
  $('ov').addEventListener('mousedown', function (e) { if (e.target === $('ov')) closeDialog(); });
  if (onMount) onMount();
  var f = overlayRoot.querySelector('input,button.primary,button'); if (f) f.focus();
}
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function collectVoxels() {
  var out = [];
  for (var y = 0; y < SY; y++) for (var z = 0; z < SZ; z++) for (var x = 0; x < SX; x++) {
    var v = grid[(y * SZ + z) * SX + x]; if (v) out.push([x, y, z, v - 1]);
  }
  return out;
}
function cleanName(s) { return (s || 'construcao').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') || 'construcao'; }
async function saveBytes(filename, bytes, mime) {
  if (inArtifact) {
    var dl = await window.claude.use('downloads');
    if (!dl) throw { code: 'unavailable' };
    var ext = filename.split('.').pop().toLowerCase(), fn = filename, data = bytes, zipped = false;
    if (['json', 'txt', 'csv', 'md', 'zip'].indexOf(ext) < 0) { data = MCExport.makeZip([{ name: filename, data: bytes }]); fn = filename + '.zip'; zipped = true; }
    await dl.save({ filename: fn, data: data });
    return { zipped: zipped };
  }
  var blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  return { zipped: false };
}
function reportSave(r, name) {
  toast(r.zipped ? 'Salvo ' + name + ' dentro de um .zip. Extraia antes de importar.' : 'Arquivo ' + name + ' gerado.');
}
function reportErr(e) {
  if (e && e.code === 'declined') return toast('Download cancelado.');
  if (e && e.code === 'unavailable') return toast('Download indisponível nesta visualização. Use a versão em arquivo local.');
  toast((e && e.message) || 'Não foi possível gerar o arquivo.');
}

function openExport() {
  var vox = collectVoxels();
  var bb = vox.length ? MCExport.bounds(vox) : null;
  var dim = bb ? bb.w + ' × ' + bb.h + ' × ' + bb.l : 'vazia';
  openDialog(
    '<h3>Exportar construção</h3>' +
    '<div class="info">Tamanho: ' + dim + '<br>Blocos: ' + vox.length + '</div>' +
    '<label>Nome do arquivo<input type="text" id="exName" value="construcao" maxlength="40"></label>' +
    '<label class="check"><input type="checkbox" id="exKeep" checked><span>Bedrock: deixar o terreno intacto onde a construção tem ar (usa blocos vazios de estrutura). Desmarque para a construção substituir tudo no retângulo por ar.</span></label>' +
    '<div class="row"><button class="btn primary" id="exBedrock">Baixar .mcstructure (Bedrock)</button><button class="btn" id="exJava">Baixar .schem (Java)</button></div>' +
    '<p id="exNote">Bedrock: no jogo, use um bloco de estrutura, modo Carregar, botão Importar. Java: coloque o .schem na pasta de schematics do WorldEdit e use //schem load e //paste.</p>' +
    '<div class="row"><button class="btn" id="exClose">Fechar</button></div>',
    function () {
      if (inArtifact) $('exNote').textContent = 'Nesta página os arquivos saem dentro de um .zip, porque o navegador desta janela só aceita alguns tipos. Extraia o .zip e importe o arquivo de dentro. ' + $('exNote').textContent;
      $('exClose').onclick = closeDialog;
      $('exBedrock').onclick = async function () {
        try {
          var bytes = await MCExport.exportMcstructure(vox, BLOCKS, { preserveTerrain: $('exKeep').checked });
          var nm = cleanName($('exName').value) + '.mcstructure';
          reportSave(await saveBytes(nm, bytes), nm);
        } catch (e) { reportErr(e); }
      };
      $('exJava').onclick = async function () {
        try {
          var bytes = await MCExport.exportSchem(vox, BLOCKS, { name: cleanName($('exName').value) });
          var nm = cleanName($('exName').value) + '.schem';
          reportSave(await saveBytes(nm, bytes), nm);
        } catch (e) { reportErr(e); }
      };
    });
}
$('exportBtn').addEventListener('click', openExport);

function openMaterials() {
  var counts = {};
  for (var i = 0; i < grid.length; i++) if (grid[i]) counts[grid[i] - 1] = (counts[grid[i] - 1] || 0) + 1;
  var rows = Object.keys(counts).map(function (k) { return [+k, counts[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  var text = rows.map(function (r) { return BLOCKS[r[0]].name + ': ' + r[1] + ' (' + Math.floor(r[1] / 64) + ' pilhas + ' + (r[1] % 64) + ')'; }).join('\n');
  var body = rows.length ? '<div class="mat"><table>' + rows.map(function (r) {
    return '<tr><td><span class="sw" style="' + swatch(BLOCKS[r[0]]) + '"></span>' + esc(BLOCKS[r[0]].name) + '</td><td class="num">' + r[1] + '</td><td class="num">' + Math.floor(r[1] / 64) + ' × 64 + ' + (r[1] % 64) + '</td></tr>';
  }).join('') + '</table></div>' : '<p>A construção está vazia.</p>';
  openDialog('<h3>Lista de materiais</h3><p>' + blockCount + ' blocos de ' + rows.length + ' tipos.</p>' + body +
    '<div class="row"><button class="btn primary" id="mCopy">Copiar lista</button><button class="btn" id="mClose">Fechar</button></div>',
    function () {
      $('mClose').onclick = closeDialog;
      $('mCopy').onclick = function () {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Lista copiada.'); }, function () { toast('Não foi possível copiar.'); });
        else toast('Não foi possível copiar.');
      };
    });
}
$('matBtn').addEventListener('click', openMaterials);

function openSize() {
  openDialog('<h3>Tamanho do espaço</h3><p>Área de trabalho em blocos (8 a 128 por lado). Ao diminuir, blocos fora do novo limite são removidos.</p>' +
    '<div class="row"><label>Largura (X)<input type="number" id="szX" min="8" max="128" value="' + SX + '"></label><label>Altura (Y)<input type="number" id="szY" min="8" max="128" value="' + SY + '"></label><label>Profundidade (Z)<input type="number" id="szZ" min="8" max="128" value="' + SZ + '"></label></div>' +
    '<div class="row"><button class="btn primary" id="szOk">Aplicar</button><button class="btn" id="szNo">Cancelar</button></div>',
    function () {
      $('szNo').onclick = closeDialog;
      $('szOk').onclick = function () {
        var f = function (id) { return Math.max(8, Math.min(128, parseInt($(id).value, 10) || 32)); };
        resizeWorld(f('szX'), f('szY'), f('szZ')); closeDialog(); toast('Espaço: ' + SX + ' × ' + SY + ' × ' + SZ);
      };
    });
}
function openHelp() {
  openDialog('<h3>Atalhos e ajuda</h3><div class="keys">' +
    '<span><kbd>Clique esq.</kbd></span><span>Usar a ferramenta (arraste para pintar)</span>' +
    '<span><kbd>Shift</kbd> + clique</span><span>Pincel apaga; nas formas, apaga a forma</span>' +
    '<span><kbd>Botão dir.</kbd> arrastar</span><span>Girar a câmera (clique simples cancela a forma)</span>' +
    '<span><kbd>Botão do meio</kbd> ou <kbd>Shift</kbd> + dir.</span><span>Mover a câmera</span>' +
    '<span><kbd>Roda</kbd></span><span>Zoom</span>' +
    '<span><kbd>B E I L R H S O</kbd></span><span>Pincel, borracha, conta-gotas, linha, caixa, caixa oca, esfera, esfera oca</span>' +
    '<span><kbd>1</kbd>…<kbd>9</kbd></span><span>Escolher bloco rápido</span>' +
    '<span><kbd>[</kbd> <kbd>]</kbd></span><span>Descer e subir a camada visível</span>' +
    '<span><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Y</kbd></span><span>Desfazer e refazer</span>' +
    '<span><kbd>Setas</kbd></span><span>Mover a câmera</span>' +
    '<span><kbd>Home</kbd></span><span>Recentralizar a câmera</span>' +
    '<span><kbd>G</kbd></span><span>Grade</span></div>' +
    '<p>No toque: um dedo toca para usar a ferramenta e arrasta para girar; dois dedos movem e dão zoom. Formas usam dois toques: ponto inicial e ponto final. A bússola no chão mostra N, S, L (leste) e O (oeste).</p>' +
    '<div class="row"><button class="btn primary" id="hClose">Entendi</button></div>',
    function () { $('hClose').onclick = closeDialog; });
}

var confirmTimer = 0;
$('newBtn').addEventListener('click', function () {
  var b = $('newBtn');
  if (b.dataset.armed) { b.dataset.armed = ''; b.textContent = 'Novo (limpar tudo)'; newWorld(SX, SY, SZ); changed(); updateStatus(); toast('Construção limpa.'); $('menu').open = false; return; }
  b.dataset.armed = '1'; b.textContent = 'Clique de novo para apagar tudo';
  clearTimeout(confirmTimer); confirmTimer = setTimeout(function () { b.dataset.armed = ''; b.textContent = 'Novo (limpar tudo)'; }, 4000);
});
$('saveBtn').addEventListener('click', async function () {
  $('menu').open = false;
  try { var nm = 'projeto-bloco-a-bloco.json'; var r = await saveBytes(nm, new TextEncoder().encode(JSON.stringify(serialize())), 'application/json'); reportSave(r, nm); } catch (e) { reportErr(e); }
});
$('openBtn').addEventListener('click', function () { $('menu').open = false; $('fileIn').click(); });
$('fileIn').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try { var miss = loadProject(JSON.parse(rd.result)); toast(miss ? 'Projeto aberto (' + miss + ' blocos desconhecidos ignorados).' : 'Projeto aberto.'); } catch (x) { toast(x.message || 'Não foi possível abrir o arquivo.'); }
  };
  rd.readAsText(f); e.target.value = '';
});
$('sizeBtn').addEventListener('click', function () { $('menu').open = false; openSize(); });
$('gridBtn').addEventListener('click', function () { showGrid = !showGrid; positionGrid(); requestRender(); $('menu').open = false; });
$('helpBtn').addEventListener('click', function () { $('menu').open = false; openHelp(); });
var themeMode = 'auto';
try { themeMode = localStorage.getItem('bloco-a-bloco-theme') || 'auto'; } catch (e) {}
function applyTheme() {
  if (themeMode === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', themeMode);
  $('themeBtn').textContent = 'Tema: ' + (themeMode === 'auto' ? 'automático' : themeMode === 'light' ? 'claro' : 'escuro');
  if (scene) { buildHelpers(); updatePreview(); requestRender(); }
}
$('themeBtn').addEventListener('click', function () {
  themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto';
  try { localStorage.setItem('bloco-a-bloco-theme', themeMode); } catch (e) {}
  applyTheme();
});
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (themeMode === 'auto' && scene) { buildHelpers(); requestRender(); } });

/* ---------- Teclado ---------- */
window.addEventListener('keydown', function (e) {
  var tg = e.target, typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable);
  if (e.key === 'Shift') { lastShift = true; updatePreview(); }
  if (e.key === 'Escape') { if (overlayRoot.firstChild) closeDialog(); else if (anchor) { anchor = null; updateAnchorChip(); updatePreview(); } $('menu').open = false; return; }
  if (typing || overlayRoot.firstChild || !camera) return;
  var k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var map = { b: 'place', e: 'erase', i: 'pick', l: 'line', r: 'box', h: 'hbox', s: 'sphere', o: 'hsphere' };
  if (map[k]) { setTool(map[k]); return; }
  if (k >= '1' && k <= '9') { selectSlot(+k - 1); return; }
  if (k === '[') { setLayer(true, (layerOn ? layerY : topY()) - 1); return; }
  if (k === ']') { setLayer(true, (layerOn ? layerY : topY()) + 1); return; }
  if (k === 'g') { showGrid = !showGrid; positionGrid(); requestRender(); return; }
  if (k === 'home') { resetCamera(); return; }
  if (k === '?') { openHelp(); return; }
  var m = camera.matrix.elements, st = cam.dist * 0.05;
  if (k === 'arrowleft') { cam.tx -= m[0] * st; cam.tz -= m[2] * st; }
  else if (k === 'arrowright') { cam.tx += m[0] * st; cam.tz += m[2] * st; }
  else if (k === 'arrowup') { var fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw); cam.tx += fx * st; cam.tz += fz * st; }
  else if (k === 'arrowdown') { var gx = Math.sin(cam.yaw), gz = Math.cos(cam.yaw); cam.tx += gx * st; cam.tz += gz * st; }
  else return;
  e.preventDefault(); updateCamera(); requestRender();
});
window.addEventListener('keyup', function (e) { if (e.key === 'Shift') { lastShift = false; updatePreview(); } });

/* ---------- Loop ---------- */
function frame() {
  requestAnimationFrame(frame);
  if (!needsRender || !renderer) return;
  needsRender = false;
  rebuildDirty();
  renderer.render(scene, camera);
}

/* ---------- Início ---------- */
applyTheme();
renderChips(); renderList(); renderTools(); renderHotbar(); syncLayerUI();
if (!THREE_OK) {
  viewport.innerHTML = '<div class="empty" style="padding:32px">Não foi possível carregar a biblioteca 3D. Verifique a conexão com a internet e recarregue a página.</div>';
} else {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  initThree(); bindCanvas();
  loadPacks().then(function () { if (packs.length) applyTextures(); });
  if (saved && saved.rle) { try { loadProject(saved); } catch (e) { buildSample(); } }
  else { buildSample(); dirtyAll(); }
  changed(); updateStatus();
  if (!saved) setTimeout(function () { toast('Exemplo carregado. Use Projeto > Novo para começar do zero.'); }, 600);
  requestAnimationFrame(frame);
  window.__bab = { grid: function () { return grid; }, setTool: setTool, cam: cam, press: pressAt, target: targetAt, count: function () { return blockCount; }, undo: undo, redo: redo, vox: collectVoxels, layer: setLayer, update: function () { updateCamera(); requestRender(); } };
}
})();
</script>
