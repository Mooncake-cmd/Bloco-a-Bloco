<title>Bloco a Bloco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ateliê de maquete. Viewport 3D à esquerda, paleta de blocos na lateral direita, barra de ferramentas no topo, hotbar sobre o viewport. */
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --panel-2:#e6ebe7; --fg:#18221d; --muted:#586861; --line:#cdd6d0;
  --accent:#b4530a; --accent-fg:#ffffff; --danger:#b3261e; --info:#1d6fa5; --hud:rgba(251,252,251,.86);
  --scene-bg:#dbe5e3; --scene-floor:#c9d7d4; --scene-grid:#9bb0aa; --scene-edge:#5d7770;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1412; --panel:#161d1a; --panel-2:#1f2924; --fg:#e5ebe7; --muted:#8c9d94; --line:#2a3631;
    --accent:#f0a23b; --accent-fg:#1a1204; --danger:#ff7b72; --info:#6cb6e8; --hud:rgba(22,29,26,.86);
    --scene-bg:#0d1210; --scene-floor:#141b18; --scene-grid:#2f3f39; --scene-edge:#4f6b60;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#161d1a; --panel-2:#1f2924; --fg:#e5ebe7; --muted:#8c9d94; --line:#2a3631;
  --accent:#f0a23b; --accent-fg:#1a1204; --danger:#ff7b72; --info:#6cb6e8; --hud:rgba(22,29,26,.86);
  --scene-bg:#0d1210; --scene-floor:#141b18; --scene-grid:#2f3f39; --scene-edge:#4f6b60;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(0,1fr) 308px;height:100%}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:8px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.brand small{font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
.group{display:flex;align-items:center;gap:1px;padding:2px;background:var(--panel-2);border-radius:8px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:26px;height:34px;padding:0 3px;border:0;border-radius:6px;background:transparent;color:var(--fg)}
.tbtn:hover{background:var(--line)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tbtn svg .f{fill:currentColor;fill-opacity:.22}
.tbtn.txt{padding:0 7px;font-weight:500}
.tbtn.primary{background:var(--accent);color:var(--accent-fg);font-weight:600}
.tbtn.primary:hover{filter:brightness(1.08)}
.spacer{flex:1 1 0}
.layer{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.layer{gap:4px}
.tbtn.lstep{min-width:16px;padding:0}
#layerBtn{padding:0 5px}
.tbtn.lstep svg{width:16px;height:16px}
.tbtn.lstep:disabled{opacity:.35}
.layer input[type=range]{width:32px;accent-color:var(--accent)}
.layer output{font-family:var(--font-mono);min-width:34px;color:var(--fg)}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:40px;z-index:30;min-width:240px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);overflow-y:auto;overscroll-behavior:contain}
details.menu .pop button,details.menu .pop a{flex:none;justify-content:flex-start;height:36px;width:100%;text-decoration:none;text-align:left;white-space:nowrap}
#viewport{position:relative;flex:1 1 auto;min-height:0;background:var(--scene-bg);overflow:hidden}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--hud);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
.slot{position:relative;width:44px;height:44px;border:2px solid transparent;border-radius:6px;background:var(--panel-2);padding:0;overflow:hidden}
.slot[aria-pressed="true"]{border-color:var(--accent)}
.slot .n{position:absolute;left:3px;top:1px;font:500 10px var(--font-mono);color:#fff;text-shadow:0 1px 2px #000}
.sw{display:block;width:100%;height:100%}
#hud-tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;background:var(--hud);border:1px solid var(--line);border-radius:8px;font:500 12px var(--font-mono);backdrop-filter:blur(6px);pointer-events:auto}
.chip b{font-weight:500;color:var(--muted)}
.chip button{border:0;background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:2px 8px;font-size:12px}
#eraseBtns{display:inline-flex;gap:4px}
#eraseBtns button{background:var(--line);color:var(--fg)}
#eraseBtns button[aria-pressed=true]{background:var(--danger);color:#fff}
#walkChip,#tpChip,#ghostChip,#worldChip,#maskChip,#mixChip,#bioChip,#shape2Chip,#sculptChip,#symChip,#rulerChip{flex-wrap:wrap;max-width:min(560px,calc(100vw - 40px))}
.chip .mbtns{display:inline-flex;align-items:center;gap:4px}
.chip .mbtns button{background:var(--line);color:var(--fg)}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;z-index:5;background:linear-gradient(#fff,#fff) center/2px 100% no-repeat,linear-gradient(#fff,#fff) center/100% 2px no-repeat;filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000)}
body.walking #viewport canvas{cursor:none}
.chip kbd{font-size:10px;padding:0 4px}
.chip .mbtns button#ghostOn[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.chip .mbtns button#worldExp{background:var(--accent);color:var(--accent-fg)}
.chip .mbtns button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
#symChip .mbtns button[data-sa="0"][aria-pressed=true]{background:#e0533d;color:#fff}
#symChip .mbtns button[data-sa="1"][aria-pressed=true]{background:#3fa34d;color:#fff}
#symChip .mbtns button[data-sa="2"][aria-pressed=true]{background:#3d7ee0;color:#fff}
#selChip{flex-wrap:wrap;max-width:min(560px,calc(100vw - 40px))}
#selChip .mvb{display:inline-flex;align-items:center;gap:3px;margin-right:4px}
#selChip .mvb button{background:var(--line);color:var(--fg);min-width:24px;padding:2px 5px}
#selBtns{display:inline-flex;flex-wrap:wrap;gap:4px}
#selBtns button+button{background:var(--line);color:var(--fg)}
.dialog .err{color:var(--danger)}
#status{display:flex;flex-wrap:wrap;gap:4px 18px;padding:6px 16px;background:var(--panel);border-top:1px solid var(--line);font:12px var(--font-mono);color:var(--muted)}
#status span b{color:var(--fg);font-weight:500}
#sidebar{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-left:1px solid var(--line)}
#sidebar .head{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px}
#sidebar h2{margin:0;font:700 13px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#search{width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#chips{display:flex;flex-wrap:wrap;gap:4px}
#chips button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted)}
#chips button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
#chips button.mine{border-style:dashed}
#tools .tbtn{min-width:23px;padding:0 1px}
.mixbar{display:inline-flex;width:84px;height:14px;border-radius:3px;overflow:hidden;border:1px solid var(--line);vertical-align:middle;margin:0 6px;flex:none}
.mixbar span{height:100%;image-rendering:pixelated}
.mixbar.big{display:flex;width:100%;height:22px;margin:0;border-radius:6px}
.mixl{font-size:12px}
#bioSel{max-width:180px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:12px}
.bsw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
.mxrows{display:flex;flex-direction:column;gap:6px}
.mxrow{display:flex;align-items:center;gap:8px}
.mxrow .sw{width:26px;height:26px;border-radius:4px;flex:none}
.mxrow [data-mn]{flex:1 1 200px}
.mxrow [data-mr]{flex:1 1 120px;accent-color:var(--accent)}
.dialog .mxrow input[data-mp]{width:76px;flex:none}
.mxrow .btn{height:32px;padding:0 10px}
.pen b.ok{color:var(--fg)}
.pen b.err,.mixl .err{color:var(--danger)}
#chips button.pedit{border-color:transparent;color:var(--accent);font-weight:600}
.palit{display:flex;align-items:center;gap:12px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);flex-wrap:wrap}
.palit.off{opacity:.6}
.palit .nm{flex:1;min-width:160px;display:flex;flex-direction:column;gap:2px}
.palit .nm small,.palit .row small{color:var(--muted);font-size:12px}
.palit .btn{height:30px;padding:0 10px}
.pelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 10px;max-height:46vh;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.dialog .peit{flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-size:13px;padding:2px}
.peit input{accent-color:var(--accent)}
.peit .sw{width:18px;height:18px;border-radius:3px;flex:none}
.pelist .empty{grid-column:1/-1;color:var(--muted);font-size:12px;padding:6px}
.pen{color:var(--muted);font-size:12px}
#list{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 8px 12px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:5px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left}
.item:hover{background:var(--panel-2)}
.item.sel{border-color:var(--accent);background:var(--panel-2)}
.item .sw{width:30px;height:30px;flex:none;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.item .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.item .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{font:11px var(--font-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .star{border:0;background:transparent;color:var(--muted);font-size:16px;padding:2px 4px;line-height:1}
.item .star.on{color:var(--accent)}
.empty{padding:20px 12px;color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
.dialog{width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.dialog.wide{width:min(900px,100%)}
.wmap{position:relative;height:min(52vh,460px);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2)}
.wmap canvas{display:block;touch-action:none;cursor:crosshair}
.wmleg{font-size:12px;color:var(--muted);gap:6px 8px}
.wmleg .check{font-size:12px}
.seg2 button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.wmbio{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--fg);max-height:84px;overflow:auto;flex:none}
.wbl{white-space:nowrap}
.wsw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);flex:none}
.wsw.un{background:rgba(214,58,48,.6)}.wsw.gen{background:rgba(96,106,128,.75)}
#wmHov{margin-left:auto;font-family:var(--font-mono)}
.wzoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.wzoom button,.wtabs button{min-width:34px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:600}
.wtabs{display:flex;flex-wrap:wrap;gap:6px}
.wtabs button{padding:0 12px}
.wtabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.wtabs button:disabled{opacity:.45}
.dialog p.wmhelp{font-size:12px}
.lib{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
.libit{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);flex-wrap:wrap}
.libit img{width:64px;height:64px;border-radius:6px;background:var(--bg);image-rendering:pixelated;flex:none}
.libit .nm{flex:1;min-width:160px;display:flex;flex-direction:column;gap:2px}
.libit .nm small{color:var(--muted);font:12px var(--font-mono)}
.libit .btn{height:32px;padding:0 10px}
.hgraph{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.hgraph svg{display:block}
.hgraph .hn{cursor:pointer}
.hgraph .hn:hover circle{stroke-width:4}
.hmarks{margin-top:8px}
.hmarks .btn{height:30px;padding:0 10px}
.hmarks .btn[aria-pressed=true]{border-color:var(--accent)}
.dialog h3{margin:0;font:700 20px var(--font-display);letter-spacing:-.01em}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dialog label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.dialog input[type=text],.dialog input[type=number],.dialog select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
.dialog .check{flex-direction:row;align-items:flex-start;gap:8px;color:var(--fg);font-size:13px}
.dialog .check input{margin-top:3px;accent-color:var(--accent)}
.btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
a.btn{display:inline-flex;align-items:center;color:var(--fg);text-decoration:none}
.dialog .get{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.dialog .get b{font-size:13px}
.dialog .get .row{align-items:center}
.dialog .get small{color:var(--muted);font-size:12px}
.dialog .get a:not(.btn){color:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.info{padding:10px 12px;border-radius:8px;background:var(--panel-2);font:12px/1.5 var(--font-mono)}
.mat{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.mat table{width:100%;border-collapse:collapse;font-size:13px}
.mat td{padding:5px 10px;border-bottom:1px solid var(--line)}
.mat td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.mat td small{color:var(--muted)}
.mat td.num .btn{font-family:var(--font-ui);height:32px}
.mat .sw{display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:8px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
kbd{font:500 11px var(--font-mono);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel-2)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:60;padding:8px 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:13px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#busy{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:70;width:min(360px,calc(100% - 32px));padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;font-size:13px}
#busy .bl{display:flex;align-items:center;gap:10px}
#busy .sp{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
#busy .bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 40%}
  #sidebar{border-left:0;border-top:1px solid var(--line)}
  .layer input[type=range]{width:80px}
  .slot{width:36px;height:36px}
}
/* Tela limpa (Tab): só a cena 3D, a hotbar e os avisos das ferramentas; as teclas continuam valendo */
body.clean #toolbar,body.clean #sidebar,body.clean #status{display:none}
body.clean #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#cleanChip{position:absolute;right:12px;top:12px;display:none;align-items:center;gap:8px;padding:5px 6px 5px 10px;background:var(--hud);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);font-size:12px;color:var(--muted);z-index:5}
body.clean #cleanChip{display:flex}
#cleanChip svg{width:18px;height:18px;fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#cleanChip svg .f{fill:var(--accent-soft,rgba(180,90,20,.25))}
#cleanChip b{color:var(--fg);font-weight:600}
#cleanChip button{font:inherit;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);cursor:pointer}
@media (prefers-reduced-motion:reduce){#toast,#busy .bar i{transition:none}#busy .sp{animation:none}}
</style>

<div id="app">
  <div id="main">
    <div id="toolbar" role="toolbar" aria-label="Ferramentas de construção">
      <div class="group" id="tools"></div>
      <div class="group">
        <button class="tbtn" id="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4M3 9h8a5 5 0 010 10h-2"/></svg></button>
        <button class="tbtn" id="histBtn" title="Histórico: linha do tempo com ramos" aria-label="Histórico"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg></button>
        <button class="tbtn" id="redo" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4M17 9H9a5 5 0 000 10h2"/></svg></button>
      </div>
      <div class="layer">
        <button class="tbtn" id="measTbtn" aria-pressed="true" title="Mostrar medidas da construção (D)" aria-label="Mostrar medidas"><svg viewBox="0 0 20 20"><path d="M3 15h14M3 12v6M17 12v6"/><path d="M5 15l-1.5-1.2M5 15l-1.5 1.2M15 15l1.5-1.2M15 15l1.5 1.2"/><path class="f" d="M5 3h10v6H5z"/><path d="M5 3h10v6H5z"/></svg></button>
        <button class="tbtn txt" id="layerBtn" aria-pressed="false" title="Mostrar só até uma altura ( [ e ] )">Camada</button>
        <button class="tbtn lstep" id="layerDown" title="Descer uma camada ( [ )" aria-label="Descer uma camada" disabled><svg viewBox="0 0 20 20"><path d="M5 8l5 5 5-5"/></svg></button>
        <input type="range" id="layerRange" min="0" max="31" value="0" disabled aria-label="Altura da camada">
        <button class="tbtn lstep" id="layerUp" title="Subir uma camada ( ] )" aria-label="Subir uma camada" disabled><svg viewBox="0 0 20 20"><path d="M5 12l5-5 5 5"/></svg></button>
        <output id="layerOut">–</output>

<script>
// Exportadores de estruturas do Minecraft: .schem (Java, Sponge v3) e .mcstructure (Bedrock).
// Sem dependências: funciona no navegador e no Node.
(function (root) {
  'use strict';

  // ---------- Escritor NBT mínimo ----------
  // Valores: {t:'byte'|'short'|'int'|'string'|'bytes'|'list'|'compound', v:...}
  function NbtWriter(little) {
    this.little = little;
    this.buf = new Uint8Array(1024);
    this.len = 0;
  }
  NbtWriter.prototype.ensure = function (n) {
    if (this.len + n <= this.buf.length) return;
    let cap = this.buf.length;
    while (cap < this.len + n) cap *= 2;
    const nb = new Uint8Array(cap);
    nb.set(this.buf.subarray(0, this.len));
    this.buf = nb;
  };
  NbtWriter.prototype.u8 = function (v) { this.ensure(1); this.buf[this.len++] = v & 255; };
  NbtWriter.prototype.u16 = function (v) {
    this.ensure(2);
    if (this.little) { this.buf[this.len++] = v & 255; this.buf[this.len++] = (v >> 8) & 255; }
    else { this.buf[this.len++] = (v >> 8) & 255; this.buf[this.len++] = v & 255; }
  };
  NbtWriter.prototype.i32 = function (v) {
    this.ensure(4);
    if (this.little) for (let i = 0; i < 4; i++) this.buf[this.len++] = (v >> (8 * i)) & 255;
    else for (let i = 3; i >= 0; i--) this.buf[this.len++] = (v >> (8 * i)) & 255;
  };
  NbtWriter.prototype.str = function (s) {
    const b = new TextEncoder().encode(s);
    this.u16(b.length);
    this.ensure(b.length);
    this.buf.set(b, this.len);
    this.len += b.length;
  };
  const TAGID = { byte: 1, short: 2, int: 3, bytes: 7, string: 8, list: 9, compound: 10, ints: 11 };
  NbtWriter.prototype.payload = function (val) {
    switch (val.t) {
      case 'byte': this.u8(val.v); break;
      case 'short': this.u16(val.v); break;
      case 'int': this.i32(val.v); break;
      case 'string': this.str(val.v); break;
      case 'bytes':
        this.i32(val.v.length);
        this.ensure(val.v.length);
        this.buf.set(val.v, this.len);
        this.len += val.v.length;
        break;
      case 'ints': this.i32(val.v.length); for (const x of val.v) this.i32(x); break;
      case 'list': { // val.of = tipo dos itens; val.v = array de payloads
        this.u8(TAGID[val.of] || 0);
        this.i32(val.v.length);
        for (const item of val.v) this.payload({ t: val.of, v: item });
        break;
      }
      case 'compound':
        for (const k of Object.keys(val.v)) {
          const c = val.v[k];
          this.u8(TAGID[c.t]);
          this.str(k);
          this.payload(c);
        }
        this.u8(0);
        break;
      default: throw new Error('tag NBT desconhecida: ' + val.t);
    }
  };
  NbtWriter.prototype.finish = function () { return this.buf.slice(0, this.len); };

  function nbtRoot(name, compound, little) {
    const w = new NbtWriter(little);
    w.u8(10);
    w.str(name);
    w.payload({ t: 'compound', v: compound });
    return w.finish();
  }

  // ---------- Util ----------
  function varint(out, n) {
    while (n >= 0x80) { out.push((n & 0x7f) | 0x80); n >>>= 7; }
    out.push(n);
  }

  function bounds(voxels) {
    let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    for (const [x, y, z] of voxels) {
      if (x < minX) minX = x; if (y < minY) minY = y; if (z < minZ) minZ = z;
      if (x > maxX) maxX = x; if (y > maxY) maxY = y; if (z > maxZ) maxZ = z;
    }
    return { minX, minY, minZ, maxX, maxY, maxZ, w: maxX - minX + 1, h: maxY - minY + 1, l: maxZ - minZ + 1 };
  }

  async function gzip(u8) {
    if (typeof CompressionStream !== 'undefined') {
      const cs = new CompressionStream('gzip');
      const stream = new Blob([u8]).stream().pipeThrough(cs);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    // Node
    const zlib = require('zlib');
    return new Uint8Array(zlib.gzipSync(u8));
  }

  // Estados padrão extras (folhas não devem decair)
  // ori: índice da direção em blk.ori.o (ausente = direção inicial)
  function oriOf(blk, ori) { return blk.ori ? blk.ori.o[ori == null || !blk.ori.o[ori] ? blk.ori.d : ori] : null; }
  function javaState(blk, ori) {
    const o = oriOf(blk, ori);
    if (o) return '[' + blk.ori.k + '=' + o[0] + ']';
    if (/_leaves$/.test(blk.java)) return '[persistent=true]';
    return '';
  }

  // ---------- .schem (Sponge Schematic v3, Java) ----------
  // voxels: array de [x,y,z,idx,direção?]; BLOCKS[idx] = {java, bedrock, ori?, bst?}
  async function exportSchem(voxels, BLOCKS, opts) {
    opts = opts || {};
    if (!voxels.length) throw new Error('A construção está vazia.');
    // blocos que só existem no Bedrock (bo) não têm equivalente no Java: ficam de fora
    voxels = voxels.filter(v => !BLOCKS[v[3]].bo);
    if (!voxels.length) throw new Error('A construção só tem blocos que não existem no Java.');
    const b = bounds(voxels);
    const grid = new Int32Array(b.w * b.h * b.l).fill(-1), oris = new Int32Array(grid.length), extra = [];
    for (const [x, y, z, idx, o, ex] of voxels) {
      const i = ((y - b.minY) * b.l + (z - b.minZ)) * b.w + (x - b.minX);
      grid[i] = idx; oris[i] = o == null ? -1 : o; if (ex) extra[i] = ex;
    }
    const palette = { 'minecraft:air': 0 };
    let next = 1;
    const data = [];
    for (let i = 0; i < grid.length; i++) {
      const idx = grid[i];
      if (idx < 0) { varint(data, 0); continue; }
      // ex.j: estado Java completo já calculado pelo editor (formas: portas, escadas, cercas...)
      const key = 'minecraft:' + BLOCKS[idx].java + (extra[i] ? extra[i].j : javaState(BLOCKS[idx], oris[i] < 0 ? null : oris[i]));
      if (palette[key] === undefined) palette[key] = next++;
      varint(data, palette[key]);
    }
    const pal = {};
    for (const k of Object.keys(palette)) pal[k] = { t: 'int', v: palette[k] };
    const dataVersion = opts.dataVersion || 4671; // Java 1.21.11
    const root = {
      Schematic: {
        t: 'compound',
        v: {
          Version: { t: 'int', v: 3 },
          DataVersion: { t: 'int', v: dataVersion },
          Metadata: { t: 'compound', v: { Name: { t: 'string', v: opts.name || 'construcao' }, Author: { t: 'string', v: opts.author || '' } } },
          Width: { t: 'short', v: b.w },
          Height: { t: 'short', v: b.h },
          Length: { t: 'short', v: b.l },
          Offset: { t: 'ints', v: [0, 0, 0] },
          Blocks: {
            t: 'compound',
            v: {
              Palette: { t: 'compound', v: pal },
              Data: { t: 'bytes', v: Uint8Array.from(data) },
              BlockEntities: { t: 'list', of: 'compound', v: [] }
            }
          }
        }
      }
    };
    return gzip(nbtRoot('', root, false));
  }

  // ---------- .mcstructure (Bedrock) ----------
  const BEDROCK_BLOCK_VERSION = 18090528; // 1.20.80: o jogo atualiza para a versão atual ao carregar
  // Blocos com direção trazem os estados padrão completos e a versão do esquema (blk.bst = [versão, {nome: [tipo, valor]}]);
  // o estado da direção (blk.ori.bk) recebe o valor da direção escolhida.
  function bedrockStates(blk, ori) {
    if (blk.bst) {
      const st = {}, o = oriOf(blk, ori);
      for (const k of Object.keys(blk.bst[1])) st[k] = { t: blk.bst[1][k][0], v: blk.bst[1][k][1] };
      if (o && st[blk.ori.bk]) st[blk.ori.bk].v = o[1];
      return st;
    }
    if (/_leaves$/.test(blk.bedrock)) return { persistent_bit: { t: 'byte', v: 1 }, update_bit: { t: 'byte', v: 0 } };
    return {};
  }
  // opts.preserveTerrain: células vazias viram structure_void (não substituem o que já existe no mundo)
  async function exportMcstructure(voxels, BLOCKS, opts) {
    opts = opts || {};
    if (!voxels.length) throw new Error('A construção está vazia.');
    const b = bounds(voxels);
    const sx = b.w, sy = b.h, sz = b.l;
    const total = sx * sy * sz;
    const grid = new Int32Array(total).fill(-1), oris = new Int32Array(total), extra = [];
    for (const [x, y, z, idx, o, ex] of voxels) {
      const i = ((x - b.minX) * sy + (y - b.minY)) * sz + (z - b.minZ);
      grid[i] = idx; oris[i] = o == null ? -1 : o; if (ex) extra[i] = ex;
    }
    const emptyName = opts.preserveTerrain === false ? 'minecraft:air' : 'minecraft:structure_void';
    const pal = []; const palIndex = {};
    function getPal(name, states, version) {
      const key = name + JSON.stringify(states);
      if (palIndex[key] === undefined) {
        palIndex[key] = pal.length;
        pal.push({ name: { t: 'string', v: name }, states: { t: 'compound', v: states }, version: { t: 'int', v: version || BEDROCK_BLOCK_VERSION } });
      }
      return palIndex[key];
    }
    const emptyIdx = getPal(emptyName, {});
    const layer0 = new Array(total), posData = {};
    for (let i = 0; i < total; i++) {
      const idx = grid[i];
      if (idx < 0) { layer0[i] = emptyIdx; continue; }
      const blk = BLOCKS[idx], ex = extra[i];
      // ex.bn/bs/bv: nome, estados e versão Bedrock calculados pelo editor (tabela Java -> Bedrock)
      if (ex) {
        layer0[i] = getPal('minecraft:' + ex.bn, ex.bs, ex.bv);
        // dados de entidade que o jogo guarda fora do estado (ex.: cor da cama)
        if (ex.ent) {
          const e = { id: { t: 'string', v: ex.ent.id }, isMovable: { t: 'byte', v: 1 } };
          for (const k of Object.keys(ex.ent)) if (k !== 'id') e[k] = { t: 'byte', v: ex.ent[k] };
          posData[String(i)] = { t: 'compound', v: { block_entity_data: { t: 'compound', v: e } } };
        }
        continue;
      }
      layer0[i] = getPal('minecraft:' + blk.bedrock, bedrockStates(blk, oris[i] < 0 ? null : oris[i]), blk.bst && blk.bst[0]);
    }
    const layer1 = new Array(total).fill(-1);
    const root = {
      format_version: { t: 'int', v: 1 },
      size: { t: 'list', of: 'int', v: [sx, sy, sz] },
      structure_world_origin: { t: 'list', of: 'int', v: [0, 0, 0] },
      structure: {
        t: 'compound',
        v: {
          block_indices: { t: 'list', of: 'list', v: [] },
          entities: { t: 'list', of: 'compound', v: [] },
          palette: {
            t: 'compound',
            v: {
              default: {
                t: 'compound',
                v: {
                  block_palette: { t: 'list', of: 'compound', v: pal.map(p => p) },
                  block_position_data: { t: 'compound', v: posData }
                }
              }
            }
          }
        }
      }
    };
    // block_indices é lista de listas de int: payload manual
    const w = new NbtWriter(true);
    w.u8(10); w.str('');
    // compound raiz escrito à mão para a lista aninhada
    function writeCompound(obj) {
      for (const k of Object.keys(obj)) {
        const c = obj[k];
        if (k === 'block_indices') {
          w.u8(9); w.str(k);
          w.u8(9); w.i32(2);
          for (const layer of [layer0, layer1]) {
            w.u8(3); w.i32(layer.length);
            for (let i = 0; i < layer.length; i++) w.i32(layer[i]);
          }
          continue;
        }
        w.u8(TAGID[c.t]); w.str(k);
        if (c.t === 'compound') { writeCompound(c.v); w.u8(0); }
        else w.payload(c);
      }
    }
    writeCompound(root);
    w.u8(0);
    return w.finish(); // .mcstructure não é comprimido
  }

  // ---------- ZIP mínimo (sem compressão) ----------
  const CRC_T = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files) {

    const d = new Date();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const f of files) {
      const name = enc.encode(f.name);
      const crc = crc32(f.data);

    on.forEach(function (ax, i) { if (!(mask & (1 << i))) return; var p = sym.p[ax], lo = p - b[ax], hi = p - a[ax]; a[ax] = lo; b[ax] = hi; dd[ax] = -dd[ax]; });
    var dup = false, clash = false;
    moves.forEach(function (m) {
      var same = m.a.join() === a.join() && m.b.join() === b.join();
      var meet = m.a[0] <= b[0] && a[0] <= m.b[0] && m.a[1] <= b[1] && a[1] <= m.b[1] && m.a[2] <= b[2] && a[2] <= m.b[2];

    });

  moves.forEach(function (m) { var l = []; blocksInBox(m.a[0], m.a[1], m.a[2], m.b[0], m.b[1], m.b[2], function (x, y, z, v) { l.push(x, y, z, v); }); lists.push(l); total += l.length / 4; });

  fluidStop();
  beginBatch('Mover seleção');
  var flow = flowOn; flowOn = false; // a água movida não escorre no meio do caminho
  try {
    // primeiro tira tudo de todas as áreas, depois põe no lugar novo (as áreas podem se cruzar no caminho)
    lists.forEach(function (l) { for (var k = 0; k < l.length; k += 4) editSet1(l[k], l[k + 1], l[k + 2], 0); });
    lists.forEach(function (l, i) { var q = moves[i].d; for (var k = 0; k < l.length; k += 4) editSet1(l[k] + q[0], l[k + 1] + q[1], l[k + 2] + q[2], l[k + 3]); });
    endBatch();

  var before = sel;
  sel = { a: [sel.a[0] + dv[0], sel.a[1] + dv[1], sel.a[2] + dv[2]], b: [sel.b[0] + dv[0], sel.b[1] + dv[1], sel.b[2] + dv[2]] };
  var last = histTop(); if (last) { last.selBefore = before; last.selAfter = sel; last.label = 'Mover seleção'; } // desfazer leva a seleção junto

  if (skipped && !moveSel.warned) { moveSel.warned = true; toast('Simetria: a cópia espelhada não foi movida porque a seleção cruza o plano (ou o espelho sairia do espaço).', 7000); }
}

/* Girar 90° no sentido horário (visto de cima): posição e estado de cada bloco */
var CWD = { north: 'east', east: 'south', south: 'west', west: 'north' };

}

/* Espelhar a cópia (eixo 0 = X, leste-oeste; 2 = Z, norte-sul): posições e estados (escadas, portas com a dobradiça

$('selBtns').addEventListener('click', function (e) {

  else if (a === 'repl') openReplace(); else if (a === 'lib') libSaveSel(); else if (a === 'paste') startPaste(); else if (a === 'rot') rotateClip(); else if (a === 'flipx') flipClip(0); else if (a === 'flipz') flipClip(2);

  if (mk && sel && tool === 'select' && !pasting && !ctrl) { e.preventDefault(); moveSel(moveDir(mk), e.shiftKey ? 5 : 1); return true; }

}

/* ---------- Árvores: Usar numa muda faz a árvore crescer, como a farinha de osso ---------- */
/* Cada gerador imita o formato da árvore do jogo (tronco, copa, cipós, cacau, raízes), com variação aleatória a cada uso.
   Como no jogo: o tronco precisa de espaço livre, as folhas só ocupam o ar (ou plantinhas) e o bloco de grama embaixo do
   tronco vira terra. Carvalho-escuro e carvalho-pálido só crescem com 4 mudas em quadrado; abeto e selva crescem gigantes assim. */
var TREE_R = Math.random;
function tRnd(a, b) { return a + Math.floor(TREE_R() * (b - a + 1)); }
function tChance(p) { return TREE_R() < p; }
function cellOf(name, props) {
  var bi = BY_JAVA[name]; if (bi == null) return 0;
  var b = BLOCKS[bi];
  if (b.shape) return mkCell(bi, stateIndex(b, props || {}));
  if (b.ori && props && props[b.ori.k] != null) for (var i = 0; i < b.ori.o.length; i++) if (b.ori.o[i][0] === props[b.ori.k]) return mkCell(bi, i);
  return mkCell(bi);
}
/* Plantinhas que a árvore pode cobrir (só as de um bloco) */
var TREE_SOFT = { short_grass: 1, grass: 1, fern: 1, dead_bush: 1, snow: 1, vine: 1, moss_carpet: 1, pale_moss_carpet: 1, leaf_litter: 1, dandelion: 1, poppy: 1, short_dry_grass: 1 };
function treeFree(x, y, z, sap, log) {
  if (!inB(x, y, z)) return false;
  var v = gget(x, y, z); if (!v) return true;
  var j = BLOCKS[cellBlock(v)].java;
  return j === sap || j in TREE_SOFT || (log && /_leaves$|_wart_block$/.test(j)); // tronco e galhos atravessam folhas
}

/* Plano da árvore: mapa de células; o tronco tem prioridade sobre folhas */
function TreePlan(sap) { this.cells = new Map(); this.trunk = []; this.sap = sap; }
TreePlan.prototype.key = function (x, y, z) { return x + ',' + y + ',' + z; };
TreePlan.prototype.log = function (x, y, z, name, axis) {
  this.cells.set(this.key(x, y, z), { x: x, y: y, z: z, v: cellOf(name, { axis: axis || 'y' }), t: 1 });
  this.trunk.push([x, y, z]);
};
TreePlan.prototype.put = function (x, y, z, name, props, strong) {
  var k = this.key(x, y, z), o = this.cells.get(k);
  if (o && (o.t || !strong)) return;
  this.cells.set(k, { x: x, y: y, z: z, v: cellOf(name, props), t: 0 });
};
TreePlan.prototype.has = function (x, y, z) { return this.cells.has(this.key(x, y, z)); };
TreePlan.prototype.leaf = function (x, y, z, name) { this.put(x, y, z, name); };
/* Camada de folhas quadrada de raio r em volta de (cx, cz), com as quinas cortadas (sempre, ou ao acaso) */
TreePlan.prototype.layer = function (cx, y, cz, r, name, corners, wide) {
  var w = wide ? 1 : 0;
  for (var dx = -r; dx <= r + w; dx++) for (var dz = -r; dz <= r + w; dz++) {
    var ex = dx < 0 ? -dx : dx - w, ez = dz < 0 ? -dz : dz - w;
    if (r > 0 && ex === r && ez === r && (corners === 'cut' || (corners === 'rand' && tChance(0.5)))) continue;
    this.leaf(cx + dx, y, cz + dz, name);
  }
};
/* Camada redonda (disco) */
TreePlan.prototype.disk = function (cx, y, cz, r, name, wide, ragged) {
  var w = wide ? 0.5 : 0, R = Math.ceil(r) + 1;
  for (var dx = -R; dx <= R + 1; dx++) for (var dz = -R; dz <= R + 1; dz++) {
    var ddx = dx - w, ddz = dz - w, d = Math.sqrt(ddx * ddx + ddz * ddz);
    if (d > r + 0.3 || (ragged && d > r - 0.7 && tChance(ragged))) continue;
    this.leaf(cx + dx, y, cz + dz, name);
  }
};
TreePlan.prototype.trunkUp = function (x, y, z, h, name, wide) {
  for (var i = 0; i < h; i++) {
    this.log(x, y + i, z, name);
    if (wide) { this.log(x + 1, y + i, z, name); this.log(x, y + i, z + 1, name); this.log(x + 1, y + i, z + 1, name); }
  }
};
/* Galho de toras em linha reta (com o eixo certo) */
TreePlan.prototype.branch = function (x0, y0, z0, x1, y1, z1, name) {
  var n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0));
  for (var i = 1; i <= n; i++) {
    var x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n), z = Math.round(z0 + (z1 - z0) * i / n);
    var ax = Math.abs(x1 - x0), az = Math.abs(z1 - z0), ay = Math.abs(y1 - y0);
    this.log(x, y, z, name, ay >= ax && ay >= az ? 'y' : ax >= az ? 'x' : 'z');
  }
};

var DIRS4 = [[0, -1, 'north', 'south'], [1, 0, 'east', 'west'], [0, 1, 'south', 'north'], [-1, 0, 'west', 'east']];
/* Cipós pendurados nas bordas da copa (selva, pântano) */
function addVines(P, prob, maxLen) {
  var leaves = []; P.cells.forEach(function (c) { if (!c.t) leaves.push(c); });
  leaves.forEach(function (c) {
    DIRS4.forEach(function (d) {
      if (!tChance(prob)) return;
      var x = c.x + d[0], z = c.z + d[1];
      if (P.has(x, c.y, z)) return;
      var len = tRnd(1, maxLen), pr = {}; pr[d[3]] = 'true';
      for (var y = c.y; y > c.y - len; y--) { if (P.has(x, y, z)) break; P.put(x, y, z, 'vine', pr); }
    });
  });
}
/* Cipós e cacau no tronco */
function trunkDecor(P, x0, y0, z0, h, wide, vineProb, cocoaProb) {
  var w = wide ? 1 : 0;
  for (var y = y0; y < y0 + h; y++) for (var tx = 0; tx <= w; tx++) for (var tz = 0; tz <= w; tz++) {
    DIRS4.forEach(function (d) {
      var x = x0 + tx + d[0], z = z0 + tz + d[1];
      if (P.has(x, y, z)) return;
      if (tChance(cocoaProb) && y < y0 + 4) { P.put(x, y, z, 'cocoa', { facing: d[3], age: String(tRnd(0, 2)) }); return; }
      if (tChance(vineProb)) { var pr = {}; pr[d[3]] = 'true'; P.put(x, y, z, 'vine', pr); }
    });
  }
}
/* Copa de bolha (carvalho, bétula, selva pequena): 4 camadas, raio 2, 2, 1, 1 */
function blobCrown(P, x, top, z, leaves, r) {
  r = r || 2;
  for (var y = top - 3; y <= top; y++) {
    var rr = y >= top - 1 ? r - 1 : r;
    P.layer(x, y, z, rr, leaves, y === top ? 'cut' : 'rand');
  }
}
/* Aglomerado redondo de folhas (carvalho grande, galhos) */

function fancyTree(P, x, y, z, log, leaves) {

    var by = y + Math.floor(h * (0.45 + 0.4 * TREE_R())), ex = x + Math.round(Math.cos(a) * len), ez = z + Math.round(Math.sin(a) * len), ey = by + tRnd(1, 2);

var SAPLINGS = {
  oak_sapling: 'oak', birch_sapling: 'birch', spruce_sapling: 'spruce', jungle_sapling: 'jungle', acacia_sapling: 'acacia',
  dark_oak_sapling: 'dark_oak', pale_oak_sapling: 'pale_oak', cherry_sapling: 'cherry', mangrove_propagule: 'mangrove',
  azalea: 'azalea', flowering_azalea: 'azalea', red_mushroom: 'red_mushroom', brown_mushroom: 'brown_mushroom',
  crimson_fungus: 'crimson_fungus', warped_fungus: 'warped_fungus'

var TREE_NAMES = { oak: 'Carvalho', birch: 'Bétula', spruce: 'Abeto', jungle: 'Árvore da selva', acacia: 'Acácia', dark_oak: 'Carvalho-escuro', pale_oak: 'Carvalho-pálido',
  cherry: 'Cerejeira', mangrove: 'Mangue', azalea: 'Azaleia', red_mushroom: 'Cogumelo vermelho gigante', brown_mushroom: 'Cogumelo marrom gigante',
  crimson_fungus: 'Fungo carmesim gigante', warped_fungus: 'Fungo distorcido gigante' };
/* 4 mudas iguais em quadrado: devolve o canto mínimo */
function saplingSquare(c, bi) {
  for (var ox = -1; ox <= 0; ox++) for (var oz = -1; oz <= 0; oz++) {
    var ok = true;
    for (var i = 0; i < 2 && ok; i++) for (var k = 0; k < 2 && ok; k++) {
      var x = c[0] + ox + i, z = c[2] + oz + k;
      ok = inB(x, c[1], z) && cellBlock(gget(x, c[1], z)) === bi && gget(x, c[1], z) !== 0;
    }
    if (ok) return [c[0] + ox, c[1], c[2] + oz];
  }
  return null;
}
/* Usar numa muda: faz crescer. Com Shift, a versão grande (carvalho grande, bétula alta, pinheiro, cogumelo alto…). Devolve true se tratou. */
/* Faz a árvore crescer a partir da muda em c, gravando com editSet (sem abrir passo de histórico nem avisar).
   Devolve null se o bloco não é muda; senão { kind, sq, n, out } ou { err: 'need2' | 'tall' | 'blocked', ... }. */
function treeGrow(c, big) {
  var v = gget(c[0], c[1], c[2]), bi = cellBlock(v), b = BLOCKS[bi], kind = SAPLINGS[b.java];
  if (!kind) return null;
  if (b.java === 'mangrove_propagule' && stateProps(b, cellOri(v)).hanging === 'true') return { err: 'hanging' };
  var sq = (kind === 'spruce' || kind === 'jungle' || kind === 'dark_oak' || kind === 'pale_oak') ? saplingSquare(c, bi) : null;
  var o = sq || c, P = new TreePlan(b.java);
  var r = TREES[kind](P, o[0], o[1], o[2], big, !!sq);
  if (r === 'need2') return { err: 'need2', kind: kind };
  // o tronco precisa de espaço (as mudas do quadrado contam como livres)
  var top = 0, blocked = null;
  P.trunk.forEach(function (t) { if (t[1] > top) top = t[1]; if (!blocked && inB(t[0], 0, t[2]) && t[1] < SY && !treeFree(t[0], t[1], t[2], b.java, true)) blocked = t; });
  if (top >= SY) return { err: 'tall', need: top - o[1] + 1 };
  if (blocked) return { err: 'blocked', at: blocked };
  var n = 0, out = 0;
  P.cells.forEach(function (q) {
    if (!inB(q.x, q.y, q.z)) { out++; return; }
    if (!q.t && !treeFree(q.x, q.y, q.z, b.java)) {
      // raízes e terra enraizada entram na terra
      var cur = gget(q.x, q.y, q.z), j = cur && BLOCKS[cellBlock(cur)].java;
      if (!(/mangrove_roots|rooted_dirt/.test(BLOCKS[cellBlock(q.v)].java) && /^(dirt|grass_block|mud|coarse_dirt|podzol|rooted_dirt|moss_block)$/.test(j))) return;
    }
    if (q.v) { editSet(q.x, q.y, q.z, q.v); n++; }
  });
  // como no jogo, a grama embaixo do tronco vira terra
  P.trunk.forEach(function (t) {
    if (t[1] - 1 < 0 || P.has(t[0], t[1] - 1, t[2])) return;
    var u = gget(t[0], t[1] - 1, t[2]);
    if (u && /^(grass_block|podzol|mycelium)$/.test(BLOCKS[cellBlock(u)].java)) editSet(t[0], t[1] - 1, t[2], cellOf('dirt'));
  });
  // mudas do quadrado que sobraram (fora do tronco) somem
  if (sq) for (var i = 0; i < 2; i++) for (var k = 0; k < 2; k++) if (cellBlock(gget(sq[0] + i, sq[1], sq[2] + k)) === bi) editSet(sq[0] + i, sq[1], sq[2] + k, 0);
  return { kind: kind, sq: sq, n: n, out: out };
}
function growAt(c, big) {
  var v = gget(c[0], c[1], c[2]);
  if (!SAPLINGS[BLOCKS[cellBlock(v)].java]) return false;
  beginBatch('Árvore');
  var r = treeGrow(c, big);
  endBatch();
  if (r.err === 'hanging') toast('O propágulo pendurado não cresce: coloque-o no chão para virar um mangue.');
  else if (r.err === 'need2') toast(TREE_NAMES[r.kind] + ' só cresce com 4 mudas em quadrado 2 × 2, como no jogo.');
  else if (r.err === 'tall') toast('Falta altura no espaço: esta árvore precisa de ' + r.need + ' blocos acima da muda. Aumente a altura em Projeto > Tamanho do espaço.', 6000);
  else if (r.err === 'blocked') toast('Sem espaço para a árvore crescer: há um bloco em ' + r.at.join(', ') + ' no caminho do tronco.', 5000);
  else toast(TREE_NAMES[r.kind] + (r.sq && (r.kind === 'spruce' || r.kind === 'jungle') ? ' gigante' : big ? ' (versão grande)' : '') + ' cresceu: ' + r.n + ' blocos' + (r.out ? ' (' + r.out + ' ficaram fora do espaço)' : '') + '. Ctrl+Z desfaz; usar de novo depois de desfazer dá outra forma.', 5000);
  return true;
}

/* ---------- Água e lava escorrendo, como no jogo ---------- */
/* Segue a regra do Java (FlowingFluid): a fonte (level 0) espalha para os lados perdendo 1 nível por bloco na água
   (até 7 blocos) e 2 na lava (3 blocos); onde há buraco, cai (level 8) e volta a espalhar no chão; entre as direções,
   prefere as que levam a um buraco mais perto (até 4 blocos na água, 2 na lava). Duas fontes de água vizinhas sobre
   chão firme criam outra fonte. Lava encostada em água vira obsidiana (fonte) ou pedregulho (corrente); lava que cai na
   água vira pedra. A simulação anda em ondas (água a cada 0,1 s, lava a cada 0,45 s) e cada mudança entra no mesmo
   passo de desfazer da edição que a provocou. Só blocos vazios recebem fluido. */
var flowOn = true;
