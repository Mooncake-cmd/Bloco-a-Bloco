<title>Bloco a Bloco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ateliê de maquete. Viewport 3D à esquerda, paleta de blocos na lateral direita, barra de ferramentas no topo, hotbar sobre o viewport. */
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --panel-2:#e6ebe7; --fg:#18221d; --muted:#586861; --line:#cdd6d0;
  --accent:#b4530a; --accent-fg:#ffffff; --danger:#b3261e; --info:#1d6fa5; --hud:rgba(251,252,251,.86);
  --scene-bg:#dbe5e3; --scene-floor:#c9d7d4; --scene-grid:#9bb0aa; --scene-edge:#5d7770;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1412; --panel:#161d1a; --panel-2:#1f2924; --fg:#e5ebe7; --muted:#8c9d94; --line:#2a3631;
    --accent:#f0a23b; --accent-fg:#1a1204; --danger:#ff7b72; --info:#6cb6e8; --hud:rgba(22,29,26,.86);
    --scene-bg:#0d1210; --scene-floor:#141b18; --scene-grid:#2f3f39; --scene-edge:#4f6b60;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#161d1a; --panel-2:#1f2924; --fg:#e5ebe7; --muted:#8c9d94; --line:#2a3631;
  --accent:#f0a23b; --accent-fg:#1a1204; --danger:#ff7b72; --info:#6cb6e8; --hud:rgba(22,29,26,.86);
  --scene-bg:#0d1210; --scene-floor:#141b18; --scene-grid:#2f3f39; --scene-edge:#4f6b60;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(0,1fr) 308px;height:100%}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.brand small{font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
.group{display:flex;align-items:center;gap:2px;padding:2px;background:var(--panel-2);border-radius:8px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:32px;height:34px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:var(--fg)}
.tbtn:hover{background:var(--line)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tbtn svg .f{fill:currentColor;fill-opacity:.22}
.tbtn.txt{padding:0 12px;font-weight:500}
.tbtn.primary{background:var(--accent);color:var(--accent-fg);font-weight:600}
.tbtn.primary:hover{filter:brightness(1.08)}
.spacer{flex:1 1 0}
.layer{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.layer input[type=range]{width:80px;accent-color:var(--accent)}
.layer output{font-family:var(--font-mono);min-width:38px;color:var(--fg)}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:40px;z-index:30;min-width:240px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
details.menu .pop button,details.menu .pop a{justify-content:flex-start;height:36px;width:100%;text-decoration:none;text-align:left;white-space:nowrap}
#viewport{position:relative;flex:1 1 auto;min-height:0;background:var(--scene-bg);overflow:hidden}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--hud);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
.slot{position:relative;width:44px;height:44px;border:2px solid transparent;border-radius:6px;background:var(--panel-2);padding:0;overflow:hidden}
.slot[aria-pressed="true"]{border-color:var(--accent)}
.slot .n{position:absolute;left:3px;top:1px;font:500 10px var(--font-mono);color:#fff;text-shadow:0 1px 2px #000}
.sw{display:block;width:100%;height:100%}
#hud-tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;background:var(--hud);border:1px solid var(--line);border-radius:8px;font:500 12px var(--font-mono);backdrop-filter:blur(6px);pointer-events:auto}
.chip b{font-weight:500;color:var(--muted)}
.chip button{border:0;background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:2px 8px;font-size:12px}
#selChip{flex-wrap:wrap;max-width:min(560px,calc(100vw - 40px))}
#selBtns{display:inline-flex;flex-wrap:wrap;gap:4px}
#selBtns button+button{background:var(--line);color:var(--fg)}
.dialog .err{color:var(--danger)}
#status{display:flex;flex-wrap:wrap;gap:4px 18px;padding:6px 16px;background:var(--panel);border-top:1px solid var(--line);font:12px var(--font-mono);color:var(--muted)}
#status span b{color:var(--fg);font-weight:500}
#sidebar{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-left:1px solid var(--line)}
#sidebar .head{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px}
#sidebar h2{margin:0;font:700 13px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#search{width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#chips{display:flex;flex-wrap:wrap;gap:4px}
#chips button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted)}
#chips button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
#list{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 8px 12px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:5px 8px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left}
.item:hover{background:var(--panel-2)}
.item.sel{border-color:var(--accent);background:var(--panel-2)}
.item .sw{width:30px;height:30px;flex:none;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.item .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.item .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{font:11px var(--font-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .star{border:0;background:transparent;color:var(--muted);font-size:16px;padding:2px 4px;line-height:1}
.item .star.on{color:var(--accent)}
.empty{padding:20px 12px;color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
.dialog{width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.dialog h3{margin:0;font:700 20px var(--font-display);letter-spacing:-.01em}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dialog label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.dialog input[type=text],.dialog input[type=number],.dialog select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
.dialog .check{flex-direction:row;align-items:flex-start;gap:8px;color:var(--fg);font-size:13px}
.dialog .check input{margin-top:3px;accent-color:var(--accent)}
.btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.info{padding:10px 12px;border-radius:8px;background:var(--panel-2);font:12px/1.5 var(--font-mono)}
.mat{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.mat table{width:100%;border-collapse:collapse;font-size:13px}
.mat td{padding:5px 10px;border-bottom:1px solid var(--line)}
.mat td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.mat td small{color:var(--muted)}
.mat td.num .btn{font-family:var(--font-ui);height:32px}
.mat .sw{display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:8px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
kbd{font:500 11px var(--font-mono);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel-2)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:60;padding:8px 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:13px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#busy{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:70;width:min(360px,calc(100% - 32px));padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;font-size:13px}
#busy .bl{display:flex;align-items:center;gap:10px}
#busy .sp{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
#busy .bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 40%}
  #sidebar{border-left:0;border-top:1px solid var(--line)}
  .layer input[type=range]{width:80px}
  .slot{width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){#toast,#busy .bar i{transition:none}#busy .sp{animation:none}}
</style>

<div id="app">
  <div id="main">
    <div id="toolbar" role="toolbar" aria-label="Ferramentas de construção">
      <div class="group" id="tools"></div>
      <div class="group">
        <button class="tbtn" id="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4M3 9h8a5 5 0 010 10h-2"/></svg></button>
        <button class="tbtn" id="redo" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4M17 9H9a5 5 0 000 10h2"/></svg></button>
      </div>
      <div class="layer">
        <button class="tbtn txt" id="layerBtn" aria-pressed="false" title="Mostrar só até uma altura ( [ e ] )">Camada</button>
        <input type="range" id="layerRange" min="0" max="31" value="0" disabled aria-label="Altura da camada">
        <output id="layerOut">–</output>
      </div>
      <div class="spacer"></div>
      <button class="tbtn txt" id="matBtn" title="Lista de materiais">Materiais</button>
      <button class="tbtn txt primary" id="exportBtn" title="Exportar .schem / .mcstructure">Exportar</button>
      <details class="menu" id="menu">
        <summary class="tbtn txt" role="button" aria-label="Menu do projeto">Projeto ▾</summary>
        <div class="pop">
          <button class="tbtn txt" id="newBtn">Novo (limpar tudo)</button>
          <button class="tbtn txt" id="saveBtn">Salvar projeto (.json)</button>
          <button class="tbtn txt" id="openBtn">Abrir projeto ou estrutura…</button>
          <button class="tbtn txt" id="sizeBtn">Tamanho do espaço…</button>
          <button class="tbtn txt" id="gridBtn">Mostrar/ocultar grade</button>
          <button class="tbtn txt" id="texBtn">Texturas…</button>
          <button class="tbtn txt" id="themeBtn">Tema: automático</button>
          <button class="tbtn txt" id="helpBtn">Atalhos e ajuda</button>
          <a class="tbtn txt" id="guideLink" href="https://mooncake-cmd.github.io/Bloco-a-Bloco/guia/" target="_blank" rel="noopener">Guia de uso completo ↗</a>
        </div>
      </details>
      <input type="file" id="fileIn" accept=".json,.mcstructure,.schem,application/json" hidden>
      <input type="file" id="packIn" accept=".zip,.mcpack,.mcaddon,application/zip" hidden>
      <input type="file" id="packDirIn" webkitdirectory hidden>
    </div>
    <div id="viewport">
      <div id="hud-tl"><div class="chip" id="anchorChip" hidden><span id="anchorTxt"></span><button id="anchorCancel">Cancelar</button></div><div class="chip" id="selChip" hidden><span id="selTxt"></span><span id="selBtns"></span></div></div>
      <div id="hotbar" aria-label="Blocos rápidos"></div>
    </div>
    <div id="status">
      <span>Alvo <b id="stPos">–</b></span>
      <span>Bloco <b id="stBlock">–</b></span>
      <span>Construção <b id="stSize">vazia</b></span>
      <span>Blocos <b id="stCount">0</b></span>
    </div>
  </div>
  <aside id="sidebar" aria-label="Blocos do Minecraft">
    <div class="head">
      <div class="brand">Bloco a Bloco</div>
      <h2>Blocos</h2>
      <input id="search" type="search" placeholder="Buscar bloco (ex.: oak, glass)" autocomplete="off" aria-label="Buscar bloco">
      <div id="chips"></div>
    </div>
    <div id="list"></div>
  </aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="busy" role="status" aria-live="polite" hidden><div class="bl"><span class="sp"></span><span id="busyTxt"></span></div><div class="bar"><i id="busyBar"></i></div></div>
<div id="overlayRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Exportadores de estruturas do Minecraft: .schem (Java, Sponge v3) e .mcstructure (Bedrock).
// Sem dependências: funciona no navegador e no Node.
(function (root) {
  'use strict';

  // ---------- Escritor NBT mínimo ----------
  // Valores: {t:'byte'|'short'|'int'|'string'|'bytes'|'list'|'compound', v:...}
  function NbtWriter(little) {
    this.little = little;
    this.buf = new Uint8Array(1024);
    this.len = 0;
  }
  NbtWriter.prototype.ensure = function (n) {
    if (this.len + n <= this.buf.length) return;
    let cap = this.buf.length;
    while (cap < this.len + n) cap *= 2;
    const nb = new Uint8Array(cap);
    nb.set(this.buf.subarray(0, this.len));
    this.buf = nb;
  };
  NbtWriter.prototype.u8 = function (v) { this.ensure(1); this.buf[this.len++] = v & 255; };
  NbtWriter.prototype.u16 = function (v) {
    this.ensure(2);
    if (this.little) { this.buf[this.len++] = v & 255; this.buf[this.len++] = (v >> 8) & 255; }
    else { this.buf[this.len++] = (v >> 8) & 255; this.buf[this.len++] = v & 255; }
  };
  NbtWriter.prototype.i32 = function (v) {
    this.ensure(4);
    if (this.little) for (let i = 0; i < 4; i++) this.buf[this.len++] = (v >> (8 * i)) & 255;
    else for (let i = 3; i >= 0; i--) this.buf[this.len++] = (v >> (8 * i)) & 255;
  };
  NbtWriter.prototype.str = function (s) {
    const b = new TextEncoder().encode(s);
    this.u16(b.length);
    this.ensure(b.length);
    this.buf.set(b, this.len);
    this.len += b.length;
  };
  const TAGID = { byte: 1, short: 2, int: 3, bytes: 7, string: 8, list: 9, compound: 10, ints: 11 };
  NbtWriter.prototype.payload = function (val) {
    switch (val.t) {
      case 'byte': this.u8(val.v); break;
      case 'short': this.u16(val.v); break;
      case 'int': this.i32(val.v); break;
      case 'string': this.str(val.v); break;
      case 'bytes':
        this.i32(val.v.length);
        this.ensure(val.v.length);
        this.buf.set(val.v, this.len);
        this.len += val.v.length;
        break;
      case 'ints': this.i32(val.v.length); for (const x of val.v) this.i32(x); break;
      case 'list': { // val.of = tipo dos itens; val.v = array de payloads
        this.u8(TAGID[val.of] || 0);
        this.i32(val.v.length);
        for (const item of val.v) this.payload({ t: val.of, v: item });
        break;
      }
      case 'compound':
        for (const k of Object.keys(val.v)) {
          const c = val.v[k];
          this.u8(TAGID[c.t]);
          this.str(k);
          this.payload(c);
        }
        this.u8(0);
        break;
      default: throw new Error('tag NBT desconhecida: ' + val.t);
    }
  };
  NbtWriter.prototype.finish = function () { return this.buf.slice(0, this.len); };

  function nbtRoot(name, compound, little) {
    const w = new NbtWriter(little);
    w.u8(10);
    w.str(name);
    w.payload({ t: 'compound', v: compound });
    return w.finish();
  }

  // ---------- Util ----------
  function varint(out, n) {
    while (n >= 0x80) { out.push((n & 0x7f) | 0x80); n >>>= 7; }
    out.push(n);
  }

  function bounds(voxels) {
    let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    for (const [x, y, z] of voxels) {
      if (x < minX) minX = x; if (y < minY) minY = y; if (z < minZ) minZ = z;
      if (x > maxX) maxX = x; if (y > maxY) maxY = y; if (z > maxZ) maxZ = z;
    }
    return { minX, minY, minZ, maxX, maxY, maxZ, w: maxX - minX + 1, h: maxY - minY + 1, l: maxZ - minZ + 1 };
  }

  async function gzip(u8) {
    if (typeof CompressionStream !== 'undefined') {
      const cs = new CompressionStream('gzip');
      const stream = new Blob([u8]).stream().pipeThrough(cs);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    // Node
    const zlib = require('zlib');
    return new Uint8Array(zlib.gzipSync(u8));
  }

  // Estados padrão extras (folhas não devem decair)
  // ori: índice da direção em blk.ori.o (ausente = direção inicial)
  function oriOf(blk, ori) { return blk.ori ? blk.ori.o[ori == null || !blk.ori.o[ori] ? blk.ori.d : ori] : null; }
  function javaState(blk, ori) {
    const o = oriOf(blk, ori);
    if (o) return '[' + blk.ori.k + '=' + o[0] + ']';
    if (/_leaves$/.test(blk.java)) return '[persistent=true]';
    return '';
  }

  // ---------- .schem (Sponge Schematic v3, Java) ----------
  // voxels: array de [x,y,z,idx,direção?]; BLOCKS[idx] = {java, bedrock, ori?, bst?}
  async function exportSchem(voxels, BLOCKS, opts) {
    opts = opts || {};
    if (!voxels.length) throw new Error('A construção está vazia.');
    // blocos que só existem no Bedrock (bo) não têm equivalente no Java: ficam de fora
    voxels = voxels.filter(v => !BLOCKS[v[3]].bo);
    if (!voxels.length) throw new Error('A construção só tem blocos que não existem no Java.');
    const b = bounds(voxels);
    const grid = new Int32Array(b.w * b.h * b.l).fill(-1), oris = new Int32Array(grid.length), extra = [];
    for (const [x, y, z, idx, o, ex] of voxels) {
      const i = ((y - b.minY) * b.l + (z - b.minZ)) * b.w + (x - b.minX);
      grid[i] = idx; oris[i] = o == null ? -1 : o; if (ex) extra[i] = ex;
    }
    const palette = { 'minecraft:air': 0 };
    let next = 1;
    const data = [];
    for (let i = 0; i < grid.length; i++) {
      const idx = grid[i];
      if (idx < 0) { varint(data, 0); continue; }
      // ex.j: estado Java completo já calculado pelo editor (formas: portas, escadas, cercas...)
      const key = 'minecraft:' + BLOCKS[idx].java + (extra[i] ? extra[i].j : javaState(BLOCKS[idx], oris[i] < 0 ? null : oris[i]));
      if (palette[key] === undefined) palette[key] = next++;
      varint(data, palette[key]);
    }
    const pal = {};
    for (const k of Object.keys(palette)) pal[k] = { t: 'int', v: palette[k] };
    const dataVersion = opts.dataVersion || 4671; // Java 1.21.11
    const root = {
      Schematic: {
        t: 'compound',
        v: {

  if (!P) throw new Error('Não achei texturas de blocos nesse arquivo. Escolha um pacote de recursos (Bedrock ou Java).');

  texOn = true; try { localStorage.setItem('bloco-a-bloco-tex', '1'); } catch (e) {}

  await savePacks();

  }).join('');
  openDialog('<h3>Texturas</h3>' +
    '<p>Escolha um pacote de recursos para ver os blocos com as texturas de verdade. Serve pacote do Bedrock (.mcpack, .zip ou a pasta) e do Java (.zip). Só muda a aparência no editor: a exportação continua igual.</p>' +
    '<div class="row"><button class="btn primary" id="txFile">Escolher arquivo…</button><button class="btn" id="txDir">Escolher pasta…</button></div>' +
    (packs.length ? '<div class="mat" id="texList"><table>' + list + '</table></div>' +
      '<label class="check"><input type="checkbox" id="txOn"' + (texOn ? ' checked' : '') + '><span>Mostrar texturas (' + texBlocks + ' de ' + BLOCKS.length + ' blocos). Se houver mais de um pacote, o de cima tem prioridade e os de baixo completam o que faltar.</span></label>'
      : '<div class="info" id="texList">Nenhum pacote carregado. Os blocos aparecem com a cor média de cada um.</div>') +

    '<div class="row"><button class="btn" id="txClose">Fechar</button></div>',

function fillWorld(w, h, l, get) {
  // o espaço passa a ter o tamanho da estrutura (no mínimo 8 por lado), sem cortar
  var sx = Math.max(8, w), sy = Math.max(8, h), sz = Math.max(8, l);
  var se = sizeError(sx, sy, sz); if (se) throw new Error('Estrutura grande demais para abrir: ' + se);
  newWorld(sx, sy, sz);
  for (var y = 0; y < h; y++) for (var z = 0; z < l; z++) for (var x = 0; x < w; x++) {
    var v = get(x, y, z); if (v) { grid[idx(x, y, z)] = v; blockCount++; }

}
function importReport(kind, cut, unknown) {
  var names = Object.keys(unknown), n = names.reduce(function (a, k) { return a + unknown[k]; }, 0);
  var msg = kind + ' importado: ' + blockCount + ' blocos.';
  msg += ' Espaço: ' + SX + ' × ' + SY + ' × ' + SZ + '.';
  if (n) msg += ' ' + n + ' blocos desconhecidos ficaram de fora: ' + names.slice(0, 6).map(function (k) { return k.replace('minecraft:', ''); }).join(', ') + (names.length > 6 ? '…' : '') + '.';
  toast(msg, n || cut ? 10000 : 4000);
}

  if (!size || !st || !st.block_indices) throw new Error('Este arquivo não parece ser um .mcstructure.');
  var pal = ((st.palette || {}).default || {}).block_palette || [], ids = st.block_indices[0];
  var unknown = {};
  var map = pal.map(function (e) {
    var n = String(e.name || '').replace(/^minecraft:/, '');
    if (/^(air|structure_void)$/.test(n)) return 0; // vazio de estrutura = "manter o terreno": no editor, vazio
    var v = cellFromBedrock(n, e.states || {});
    if (!v) unknown[n] = 0;
    return v;
  });

  var pos = ((st.palette || {}).default || {}).block_position_data || {};

    if (v && pal[k] && /bed$/.test(pal[k].name) && pos[i] && pos[i].block_entity_data && pos[i].block_entity_data.color != null) {
      var cb = BY_JAVA[(BED_COLORS[pos[i].block_entity_data.color] || 'red') + '_bed'];

function varints(u8, n) {

  var root = nbtRead(u8, false), s = root.Schematic || root;
  var W = s.Width, H = s.Height, L = s.Length;
  // v3: Blocks.{Palette, Data}; v2: Palette e BlockData na raiz
  var pal = s.Blocks ? s.Blocks.Palette : s.Palette, data = s.Blocks ? s.Blocks.Data : s.BlockData;
  if (!W || !pal || !data) throw new Error('Este arquivo não parece ser um .schem (Sponge). Arquivos .schematic antigos do MCEdit não são suportados.');
  var byId = [], unknown = {};

    var n = k.replace(/^minecraft:/, '').replace(/\[.*$/, '');
    if (/^(air|cave_air|void_air)$/.test(n)) { byId[pal[k]] = 0; return; }
    var v = cellFromJava(k); byId[pal[k]] = v;

  });
  var ids = varints(data, W * H * L);
  var cut = fillWorld(W, H, L, function (x, y, z) {
    var k = ids[(y * L + z) * W + x], v = byId[k];
    if (!v && k) { var name = Object.keys(pal).find(function (q) { return pal[q] === k; }); if (name) { var n = name.replace(/^minecraft:/, '').replace(/\[.*$/, ''); if (n in unknown) unknown[n]++; } }
    return v || 0;

  importReport('.schem', cut, unknown);
}

/* ---------- Seleção: selecionar, copiar, recortar, colar, apagar e substituir ---------- */
/* A seleção é uma caixa [min, max] escolhida com dois cliques (ferramenta Selecionar, V). A área de transferência guarda
   as células cruas (bloco + estado) relativas ao canto mínimo, então colar mantém direção, portas abertas etc. */
var selA = null;          // primeiro canto, enquanto a seleção está sendo feita
var sel = null;           // { a: [x,y,z] mínimo, b: [x,y,z] máximo }
var clip = null;          // { w, h, l, cells: Uint32Array, n: blocos }
var pasting = false;      // modo colar: a prévia segue o mouse e o clique cola
var selBox = null;

function selSize(s) { return [s.b[0] - s.a[0] + 1, s.b[1] - s.a[1] + 1, s.b[2] - s.a[2] + 1]; }
function selFrom(p, q) {
  return { a: [Math.min(p[0], q[0]), Math.min(p[1], q[1]), Math.min(p[2], q[2])], b: [Math.max(p[0], q[0]), Math.max(p[1], q[1]), Math.max(p[2], q[2])] };
}
function drawSelBox() {
  if (selBox) { scene.remove(selBox); selBox.geometry.dispose(); selBox = null; }
  var s = sel || (selA && hoverT && (hoverT.hit || hoverT.place) ? selFrom(selA, hoverT.hit || hoverT.place) : selA ? selFrom(selA, selA) : null);
  if (!s) { requestRender(); return; }
  var d = selSize(s);
  selBox = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(d[0] + 0.04, d[1] + 0.04, d[2] + 0.04)),
    new THREE.LineBasicMaterial({ color: new THREE.Color(cssColor('--info')), depthTest: false, transparent: true }));
  selBox.position.set(s.a[0] + d[0] / 2, s.a[1] + d[1] / 2, s.a[2] + d[2] / 2);
  selBox.renderOrder = 7; scene.add(selBox); requestRender();
}
function updateSelChip() {

    c.hidden = false;
    $('selTxt').innerHTML = '<b>Colar</b> ' + clip.w + ' × ' + clip.h + ' × ' + clip.l + ' (' + clip.n + ' blocos). Clique para colar.';
    $('selBtns').innerHTML = '<button data-s="rot" title="Girar 90° (R)">Girar 90°</button><button data-s="cancel">Cancelar</button>';
  } else if (sel) {

      '<button data-s="del" title="Delete">Apagar</button><button data-s="repl">Substituir…</button>' +
      (clip ? '<button data-s="paste" title="Ctrl+V">Colar</button>' : '') + '<button data-s="clear" title="Esc">Limpar</button>';
  } else if (clip && tool === 'select') {
    c.hidden = false;
    $('selTxt').innerHTML = '<b>Copiado</b> ' + clip.w + ' × ' + clip.h + ' × ' + clip.l;
    $('selBtns').innerHTML = '<button data-s="paste" title="Ctrl+V">Colar</button>';
  } else if (selA) {
    c.hidden = false; $('selTxt').innerHTML = '<b>Seleção</b>: clique no canto oposto'; $('selBtns').innerHTML = '<button data-s="clear">Cancelar</button>';
  } else c.hidden = true;
}
function selRefresh() { updateSelChip(); drawSelBox(); updatePreview(); updateStatus(); }

/* Clique da ferramenta Selecionar: primeiro canto, depois o oposto (aceita bloco ou espaço vazio) */
function selectPress(t) {
  var c = t && (t.hit || t.place); if (!c) return;

  else { sel = selFrom(selA, c); selA = null; }
  selRefresh();
}
function clearSel() { sel = null; selA = null; pasting = false; selRefresh(); }

function copySel(cut) {
  if (!sel) { toast('Selecione uma área primeiro (ferramenta Selecionar, V).'); return; }
  var d = selSize(sel), cells = new Uint32Array(d[0] * d[1] * d[2]), n = 0;
  for (var y = 0; y < d[1]; y++) for (var z = 0; z < d[2]; z++) for (var x = 0; x < d[0]; x++) {
    var v = grid[idx(sel.a[0] + x, sel.a[1] + y, sel.a[2] + z)];
    cells[(y * d[2] + z) * d[0] + x] = v; if (v) n++;
  }

function deleteSel(quiet) {

  var n = 0;

  for (var y = sel.a[1]; y <= sel.b[1]; y++) for (var z = sel.a[2]; z <= sel.b[2]; z++) for (var x = sel.a[0]; x <= sel.b[0]; x++)
    if (grid[idx(x, y, z)]) { editSet(x, y, z, 0); n++; }

/* Girar 90° no sentido horário (visto de cima): posição e estado de cada bloco */
var CWD = { north: 'east', east: 'south', south: 'west', west: 'north' };
var RAIL_CW = { north_south: 'east_west', east_west: 'north_south', ascending_north: 'ascending_east', ascending_east: 'ascending_south',
  ascending_south: 'ascending_west', ascending_west: 'ascending_north', south_east: 'south_west', south_west: 'north_west', north_west: 'north_east', north_east: 'south_east' };
function rotValue(k, v) {
  if (k === 'facing' && CWD[v]) return CWD[v];
  if (k === 'axis') return v === 'x' ? 'z' : v === 'z' ? 'x' : v;
  if (k === 'rotation') return String((+v + 4) % 16);
  if (k === 'shape' && RAIL_CW[v]) return RAIL_CW[v];
  if (k === 'orientation') return v.split('_').map(function (p) { return CWD[p] || p; }).join('_');
  return v;
}
function rotateCell(v) {
  if (!v) return 0;
  var bi = cellBlock(v), b = BLOCKS[bi], s = cellOri(v);
  if (b.shape) {
    var o = stateProps(b, s), r = {};
    for (var k in o) r[k] = rotValue(k, o[k]);
    ['north', 'east', 'south', 'west'].forEach(function (h) { if (h in o) r[CWD[h]] = o[h]; }); // trepadeiras e afins
    return mkCell(bi, stateIndex(b, r));
  }
  if (b.ori) {
    var want = rotValue(b.ori.k, b.ori.o[s][0]);
    for (var i = 0; i < b.ori.o.length; i++) if (b.ori.o[i][0] === want) return mkCell(bi, i);
  }

}

  if (!clip) return;
  var w = clip.w, h = clip.h, l = clip.l, out = new Uint32Array(clip.cells.length);
  for (var y = 0; y < h; y++) for (var z = 0; z < l; z++) for (var x = 0; x < w; x++) {
    var nx = l - 1 - z, nz = x; // norte vira leste
    out[(y * w + nz) * l + nx] = rotateCell(clip.cells[(y * l + z) * w + x]);
  }
  clip = { w: l, h: h, l: w, cells: out, n: clip.n };
  updateSelChip(); updatePreview();
}

/* Colar: a prévia fica centralizada no ponto apontado, apoiada nele */
function pasteOrigin(t) {
  var c = t && t.place; if (!c || !clip) return null;
  return [c[0] - Math.floor(clip.w / 2), c[1], c[2] - Math.floor(clip.l / 2)];
}
function startPaste() {
  if (!clip) { toast('Nada copiado ainda: selecione uma área e use Copiar (Ctrl+C).'); return; }
  pasting = true; anchor = null; updateAnchorChip(); selRefresh();
  toast('Clique onde quer colar. R gira 90°, Esc cancela.');
}

  var o = pasteOrigin(t); if (!o) return;
  var n = 0, out = 0;
  beginBatch();
  for (var y = 0; y < clip.h; y++) for (var z = 0; z < clip.l; z++) for (var x = 0; x < clip.w; x++) {
    var v = clip.cells[(y * clip.l + z) * clip.w + x]; if (!v) continue; // o ar copiado não apaga o que já existe
    var X = o[0] + x, Y = o[1] + y, Z = o[2] + z;
    if (!inB(X, Y, Z)) { out++; continue; }
    editSet(X, Y, Z, v); n++;
  }
  endBatch();
  toast('Colados ' + n + ' blocos' + (out ? ' (' + out + ' ficaram fora do espaço)' : '') + '. Clique de novo para colar outra cópia, Esc para terminar.', 5000);
}
function pastePreview(t) {
  var o = pasteOrigin(t); if (!o) return;
  var m = new THREE.Matrix4(), k = 0, info = new THREE.Color(cssColor('--info'));
  for (var y = 0; y < clip.h && k < 40000; y++) for (var z = 0; z < clip.l && k < 40000; z++) for (var x = 0; x < clip.w && k < 40000; x++) {
    if (!clip.cells[(y * clip.l + z) * clip.w + x]) continue;
    m.setPosition(o[0] + x + 0.5, o[1] + y + 0.5, o[2] + z + 0.5); previewInst.setMatrixAt(k++, m);
  }
  previewInst.count = k; previewInst.instanceMatrix.needsUpdate = true; previewInst.material.color.copy(info);
  ghostEdges.visible = false;

/* Substituir na seleção: um tipo de bloco (ou todos) por outro; opcionalmente preenche o ar */
function convertCell(v, bi) {
  // tenta manter direção e estado quando o bloco novo tem as mesmas propriedades (escada por escada, tronco por tronco)
  var b = BLOCKS[bi];

  var from = BLOCKS[cellBlock(v)], s = cellOri(v), props = {};
  if (from.shape) props = stateProps(from, s);
  else if (from.ori) props[from.ori.k] = from.ori.o[s][0];
  if (b.shape) return mkCell(bi, stateIndex(b, props));
  if (b.ori && props[b.ori.k] != null) for (var i = 0; i < b.ori.o.length; i++) if (b.ori.o[i][0] === props[b.ori.k]) return mkCell(bi, i);

function blockByText(txt) {
  txt = String(txt || '').trim().toLowerCase().replace(/^minecraft:/, '');
  if (!txt) return -1;
  if (/^(ar|air|nada|apagar)$/.test(txt)) return -2;
  if (txt in BY_JAVA) return BY_JAVA[txt];
  for (var i = 0; i < BLOCKS.length; i++) if (!BLOCKS[i].hide && BLOCKS[i].name.toLowerCase() === txt) return i;
  return -1;
}
function openReplace() {
  if (!sel) { toast('Selecione uma área primeiro (ferramenta Selecionar, V).'); return; }

  for (var y = sel.a[1]; y <= sel.b[1]; y++) for (var z = sel.a[2]; z <= sel.b[2]; z++) for (var x = sel.a[0]; x <= sel.b[0]; x++) {
    var v = grid[idx(x, y, z)]; if (!v) { empty++; continue; }
    var bi = cellBlock(v); counts[bi] = (counts[bi] || 0) + 1;

    .map(function (k) { return '<option value="' + k + '">' + esc(BLOCKS[k].name) + ' (' + counts[k] + ')</option>'; }).join('');
  var list = BLOCKS.map(function (b) { return b.hide ? '' : '<option value="' + esc(b.java) + '">' + esc(b.name) + '</option>'; }).join('');
  var d = selSize(sel);

    '<label>Trocar<select id="rpFrom">' + opts + '</select></label>' +
    '<label>Por (nome ou id; “ar” apaga)<input type="text" id="rpTo" list="rpList" value="' + esc(BLOCKS[curBlock()].java) + '" autocomplete="off"></label><datalist id="rpList">' + list + '</datalist>' +
    '<label class="check"><input type="checkbox" id="rpFill"><span>Também preencher os espaços vazios da seleção com o bloco novo</span></label>' +
    '<p id="rpErr" class="err" hidden></p>' +
    '<div class="row"><button class="btn primary" id="rpOk">Substituir</button><button class="btn" id="rpNo">Cancelar</button></div>',
    function () {

        var from = $('rpFrom').value, fill = $('rpFill').checked, n = 0;

          var v = grid[idx(x, y, z)];

$('selBtns').addEventListener('click', function (e) {
  var b = e.target.closest('[data-s]'); if (!b) return;
  var a = b.getAttribute('data-s');
  if (a === 'copy') copySel(false); else if (a === 'cut') copySel(true); else if (a === 'del') deleteSel(false);
  else if (a === 'repl') openReplace(); else if (a === 'paste') startPaste(); else if (a === 'rot') rotateClip();
  else if (a === 'cancel') { pasting = false; selRefresh(); } else if (a === 'clear') clearSel();

/* Teclado da seleção (chamado antes dos atalhos normais); devolve true se tratou a tecla */
function selectionKey(e, k) {

  if (ctrl && k === 'x' && sel) { e.preventDefault(); copySel(true); return true; }
  if (ctrl && k === 'v') { e.preventDefault(); startPaste(); return true; }

/* ---------- Projeto ---------- */
var KEY = 'bloco-a-bloco-v1';
/* Nome na paleta do projeto: id java, com a direção entre colchetes quando não é a inicial (ex.: furnace[facing=east]) */
function cellName(v) {
  var b = BLOCKS[cellBlock(v)], o = cellOri(v);
  if (b.shape) { var sp = stateProps(b, o), ks = Object.keys(sp); return ks.length ? b.java + '[' + ks.map(function (k) { return k + '=' + sp[k]; }).join(',') + ']' : b.java; }
  return b.ori && o !== b.ori.d ? b.java + '[' + b.ori.k + '=' + b.ori.o[o][0] + ']' : b.java;
}
function cellFromName(nm) {
  var ms = /^([^\[]+)\[(.*)\]$/.exec(nm || '');
  if (ms && ms[1] in BY_JAVA && BLOCKS[BY_JAVA[ms[1]]].shape) {
    var pr = {}; ms[2].split(',').forEach(function (pv) { var a = pv.split('='); pr[a[0]] = a[1]; });
    return mkCell(BY_JAVA[ms[1]], stateIndex(BLOCKS[BY_JAVA[ms[1]]], pr));
  }
  var m = /^([^\[]+)(?:\[(\w+)=(\w+)\])?$/.exec(nm || '');
  if (!m || !(m[1] in BY_JAVA)) return 0;
  var bi = BY_JAVA[m[1]], b = BLOCKS[bi], o = -1;
  if (m[3] && b.ori) for (var i = 0; i < b.ori.o.length; i++) if (b.ori.o[i][0] === m[3]) o = i;
  return mkCell(bi, o);
}
function serialize() {
  var used = {}, pal = [], rle = [];
  var last = -1, run = 0;
  for (var i = 0; i < grid.length; i++) {
    var v = grid[i], m = 0;
    if (v) { var j = cellName(v); if (!(j in used)) { used[j] = pal.length; pal.push(j); } m = used[j] + 1; }
    if (m === last) run++; else { if (run) rle.push(last, run); last = m; run = 1; }
  }
  if (run) rle.push(last, run);
  return { v: 1, size: [SX, SY, SZ], pal: pal, rle: rle, hotbar: hotbar.map(function (i) { return BLOCKS[i].java; }), slot: slot };
}
function loadProject(o) {
  if (!o || !o.size || !o.rle) throw new Error('Arquivo de projeto inválido.');
  var sx = Math.max(8, o.size[0] | 0), sy = Math.max(8, o.size[1] | 0), sz = Math.max(8, o.size[2] | 0);
  var se = sizeError(sx, sy, sz); if (se) throw new Error(se);
  newWorld(sx, sy, sz);
  var map = (o.pal || []).map(cellFromName);
  var p = 0, miss = 0;
  for (var k = 0; k < o.rle.length; k += 2) {
    var m = o.rle[k], c = o.rle[k + 1];
    var v = m ? map[m - 1] : 0;
    if (m && !v) miss += c;
    for (var q = 0; q < c && p < grid.length; q++, p++) if (v) { grid[p] = v; blockCount++; }
  }
  if (o.hotbar) hotbar = o.hotbar.map(function (j, i) { return j in BY_JAVA ? BY_JAVA[j] : hotbar[i] || 0; });
  slot = o.slot | 0;
  verCounter++; dirtyAll(); renderHotbar(); renderList(); changed();
  return miss;
}
function newWorld(sx, sy, sz) {
  var g;
  try { g = new Uint32Array(sx * sy * sz); } catch (e) { throw new Error('Sem memória para um espaço de ' + sx + ' × ' + sy + ' × ' + sz + '. Tente um tamanho menor.'); }

function buildSample() {
  var ox = Math.floor((SX - 9) / 2), oz = Math.floor((SZ - 9) / 2);
  function B(n) { return mkCell(n in BY_JAVA ? BY_JAVA[n] : 0); }
  function put(x, y, z, n) { grid[idx(ox + x, y, oz + z)] = B(n); blockCount++; }
  var x, y, z;
  for (x = 0; x < 9; x++) for (z = 0; z < 9; z++) put(x, 0, z, 'cobblestone');
  for (y = 1; y <= 3; y++) for (x = 0; x < 9; x++) for (z = 0; z < 9; z++) {
    var edge = x === 0 || x === 8 || z === 0 || z === 8;
    if (!edge) continue;
    var corner = (x === 0 || x === 8) && (z === 0 || z === 8);
    if (corner) put(x, y, z, 'oak_log');
    else if (z === 0 && x === 4 && y <= 2) continue;
    else if (y === 2 && ((z === 0 || z === 8) && (x === 2 || x === 6) || (x === 0 || x === 8) && (z === 3 || z === 5 || z === 4))) put(x, y, z, 'glass');
    else put(x, y, z, 'oak_planks');
  }
  for (var k = 0; k < 5; k++) for (x = -1 + k; x <= 9 - k; x++) for (z = -1; z <= 9; z++) {
    if (x === -1 + k || x === 9 - k) put(x, 4 + k, z, 'spruce_planks');
    else if (k === 4) put(x, 4 + k, z, 'spruce_planks');
  }
  for (x = 1; x < 8; x++) for (z = 1; z < 8; z++) { /* piso interno */ grid[idx(ox + x, 0, oz + z)] = B('oak_planks'); }
}

  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var map = { b: 'place', e: 'erase', i: 'pick', t: 'rotate', u: 'use', l: 'line', r: 'box', h: 'hbox', s: 'sphere', o: 'hsphere', v: 'select' };
  if (map[k]) { setTool(map[k]); return; }
  if (k >= '1' && k <= '9') { selectSlot(+k - 1); return; }
  if (k === '[') { setLayer(true, (layerOn ? layerY : topY()) - 1); return; }
  if (k === ']') { setLayer(true, (layerOn ? layerY : topY()) + 1); return; }
  if (k === 'g') { showGrid = !showGrid; positionGrid(); requestRender(); return; }
  if (k === 'home') { resetCamera(); return; }
  if (k === '?') { openHelp(); return; }
  var m = camera.matrix.elements, st = cam.dist * 0.05;
  if (k === 'arrowleft') { cam.tx -= m[0] * st; cam.tz -= m[2] * st; }
  else if (k === 'arrowright') { cam.tx += m[0] * st; cam.tz += m[2] * st; }
  else if (k === 'arrowup') { var fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw); cam.tx += fx * st; cam.tz += fz * st; }
  else if (k === 'arrowdown') { var gx = Math.sin(cam.yaw), gz = Math.cos(cam.yaw); cam.tx += gx * st; cam.tz += gz * st; }

  e.preventDefault(); updateCamera(); requestRender();
});
